<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMH English Social Studies Grade 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#F1E7D3;--paper2:#E9DDC4;--card:#FBF6EA;--ink:#1C1A16;--ink2:#4B4438;--ink3:#7A6F5D;--rule:#CDBB93;
 --ox:#9A3324;--brass:#B48A2C;--sea:#2D5B55;--good:#2F6B4A;--bad:#A3321F;--night:#000;
 --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
 --r:6px;--shadow:0 1px 0 rgba(28,26,22,.08),0 10px 30px -18px rgba(28,26,22,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh;
 background-image:radial-gradient(ellipse at 20% 0%,rgba(180,138,44,.10),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(154,51,36,.07),transparent 50%);}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--ox)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#loader.done{opacity:0;visibility:hidden}
#loader .lw{width:min(420px,78vw);text-align:center}
#loader img{width:100%;height:auto;display:block;animation:lfade .9s ease both}
#loader .bar{height:2px;background:#2a2a2a;margin:22px auto 10px;width:60%;overflow:hidden;border-radius:2px}
#loader .bar i{display:block;height:100%;width:40%;background:var(--brass);animation:lbar 1s ease-in-out infinite}
#loader p{color:#bfae86;font:italic 15px var(--serif);margin:0}
@keyframes lbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes lfade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:30;background:#000;color:#efe4cc;border-bottom:3px solid var(--brass)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:8px 20px}
.brand{display:flex;align-items:center;flex:none;padding:2px 0}
.brand img{height:64px;width:auto;display:block}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main button{background:none;border:0;padding:10px 14px;border-radius:4px;font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:#cdbf9e;display:flex;align-items:center;gap:8px;transition:color .2s,background .2s}
nav.main button:hover{color:#fff;background:#151515}
nav.main button[aria-current=page]{color:#000;background:var(--brass)}
nav.main svg{width:18px;height:18px}
.appname{display:flex;flex-direction:column;line-height:1.15;border-left:1px solid #3a3a3a;padding-left:16px;min-width:0}
.appname b{font:600 17px var(--serif);color:#f3e9d2;white-space:nowrap}
.appname span{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.nshort{display:none}
@media (max-width:480px){.nfull{display:none}.nshort{display:inline}}
.chip{font:600 13px var(--sans);color:#000;background:#efe4cc;padding:6px 10px;border-radius:99px;white-space:nowrap}

main{max-width:1180px;margin:0 auto;padding:28px 20px 120px}
.view{animation:vin .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font:700 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ox)}
.muted{color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--r);font-weight:600;font-size:15px;transition:transform .15s,background .2s,color .2s,box-shadow .2s;min-height:44px}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.ox{background:var(--ox);border-color:var(--ox)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;min-height:36px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:40px;align-items:center;padding:18px 0 34px;border-bottom:1px solid var(--rule)}
.hero h1{font-size:clamp(38px,5.4vw,70px);line-height:.98;font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:italic;font-weight:400;color:var(--ox)}
.hero p.lede{font:400 19px/1.5 var(--serif);color:var(--ink2);max-width:36ch;margin:18px 0 24px}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap}
.rose{width:100%;max-width:380px;justify-self:center;aspect-ratio:1}
.rose .spin{transform-origin:200px 200px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule)}
.stat{padding:22px 18px;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat b{display:block;font:700 34px/1 var(--serif);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 14px;flex-wrap:wrap}
.secthead h2{font-size:30px}
.ledger{border-top:2px solid var(--ink)}
.lrow{display:grid;grid-template-columns:70px 1fr 220px auto;gap:22px;align-items:center;padding:22px 6px;border-bottom:1px solid var(--rule);position:relative;transition:background .25s}
.lrow:hover{background:rgba(255,255,255,.35)}
.lrow .num{font:italic 600 44px/1 var(--serif);color:var(--lc)}
.lrow h3{font-size:23px;line-height:1.2}
.lrow .code{font:700 12px var(--sans);letter-spacing:.14em;color:var(--lc);text-transform:uppercase}
.lrow .yrs{font-size:14px;color:var(--ink3)}
.pbar{height:8px;background:var(--paper2);border-radius:9px;overflow:hidden;border:1px solid var(--rule)}
.pbar i{display:block;height:100%;background:var(--lc,var(--sea));width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.lrow .meta{font-size:13px;color:var(--ink3);margin-top:6px;font-variant-numeric:tabular-nums}
.lrow .acts{display:flex;gap:8px}

/* ---------- lesson ---------- */
.lhead{border-radius:var(--r);padding:30px 30px 0;color:#fff;background:var(--lc);position:relative;overflow:hidden}
.lhead:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.07) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.07) 39px 40px);pointer-events:none}
.lhead .back{background:rgba(0,0,0,.25);border:0;color:#fff;padding:8px 12px;border-radius:4px;font-weight:600;font-size:13px;position:relative;z-index:1}
.lhead h1{font-size:clamp(28px,4vw,46px);line-height:1.08;margin:16px 0 6px;max-width:22ch;position:relative;z-index:1}
.lhead .sub{opacity:.85;position:relative;z-index:1}
.tabs{display:flex;gap:4px;margin-top:22px;position:relative;z-index:1;overflow-x:auto;scrollbar-width:none}
.tabs button{background:rgba(0,0,0,.18);border:0;color:#fff;padding:12px 18px;border-radius:6px 6px 0 0;font-weight:600;white-space:nowrap;font-size:15px}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink)}
.notes{display:grid;grid-template-columns:260px 1fr;gap:40px;margin-top:30px}
.notes>*{min-width:0}
.toc{position:sticky;top:100px;align-self:start}
.toc ol{list-style:none;padding:0;margin:12px 0 0;border-left:2px solid var(--rule)}
.toc li a{display:block;padding:7px 14px;color:var(--ink2);text-decoration:none;font-size:15px;margin-left:-2px;border-left:2px solid transparent}
.toc li a:hover{color:var(--ink);border-color:var(--lc)}
.obj{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 22px;margin-bottom:26px}
.obj ul{margin:8px 0 0;padding-left:20px}
.obj li{margin:4px 0}
.sec{margin-bottom:34px;scroll-margin-top:100px}
.sec h2{font-size:28px;margin-bottom:12px;display:flex;align-items:center;gap:12px;padding:2px 0}
.sec h2:before{content:"";width:22px;height:3px;background:var(--lc)}
.sec p{margin:0 0 12px;max-width:72ch;font-size:17px}
.glossary{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--ink)}
.glossary div{padding:12px 4px;border-bottom:1px solid var(--rule)}
.glossary dt{font:600 18px var(--serif)}
.glossary dd{margin:2px 0 0;color:var(--ink2);font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border:1px solid var(--rule)}
.tbl th{background:var(--ink);color:var(--paper);text-align:left;padding:10px 12px;font-weight:600}
.tbl td{padding:12px;border-top:1px solid var(--rule);vertical-align:top}
.tbl td:first-child{font-weight:700;font-family:var(--serif)}
.tblwrap{overflow-x:auto}
.xch{display:grid;grid-template-columns:1fr 90px 1fr;gap:12px;align-items:stretch}
.xch .col{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.xch h4{margin:0 0 10px;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--lc)}
.xch .tags{display:flex;flex-wrap:wrap;gap:6px}
.xch .tags span{background:var(--paper2);padding:5px 10px;border-radius:99px;font-size:14px;opacity:0;animation:pop .4s ease forwards}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.xch .mid{display:flex;flex-direction:column;justify-content:center;gap:18px;align-items:center}
.xch .mid svg{width:80px;overflow:visible}
.dash{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}

/* flashcards */
.fcwrap{max-width:640px;margin:30px auto 0;text-align:center}
.fc{perspective:1400px;height:300px;cursor:pointer;margin:18px 0}
.fc .inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-shadow:var(--shadow);border:1px solid var(--rule)}
.fc .front{background:var(--card)}
.fc .front p{font:600 clamp(20px,3vw,27px)/1.3 var(--serif)}
.fc .back{background:var(--ink);color:var(--paper);transform:rotateY(180deg)}
.fc .back p{font:400 clamp(17px,2.4vw,21px)/1.45 var(--serif)}
.fc small{position:absolute;top:14px;left:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;opacity:.6}
.fcctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* worksheet list */
.wlist{display:grid;gap:0;border-top:2px solid var(--ink);margin-top:10px}
.witem{display:grid;grid-template-columns:110px 1fr 140px auto;gap:18px;align-items:center;padding:16px 6px;border-bottom:1px solid var(--rule)}
.witem .k{font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.witem .k b{display:block;color:var(--lc,var(--ox));font-size:12px}
.witem h4{margin:0;font:600 18px/1.25 var(--serif)}
.witem .src{font-size:12px;color:var(--ink3);overflow-wrap:anywhere}
.score{font:700 20px var(--serif);font-variant-numeric:tabular-nums}
.score small{display:block;font:600 11px var(--sans);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}

/* ---------- runner ---------- */
.runner{max-width:820px;margin:0 auto}
.rtop{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.rtop .t{flex:1;min-width:0}
.rtop .t h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .t div{font-size:13px;color:var(--ink3);overflow-wrap:anywhere}
.timer{font:600 15px var(--sans);font-variant-numeric:tabular-nums;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:4px}
.segs{display:flex;gap:3px;margin-bottom:22px}
.segs i{flex:1;height:7px;background:var(--paper2);border-radius:2px;border:1px solid var(--rule);transition:background .3s}
.segs i.cur{background:var(--brass);border-color:var(--brass)}
.segs i.ok{background:var(--good);border-color:var(--good)}
.segs i.no{background:var(--bad);border-color:var(--bad)}
.segs i.part{background:#C08A2E;border-color:#C08A2E}
.segs i.ans{background:var(--ink2);border-color:var(--ink2)}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:28px;box-shadow:var(--shadow);animation:vin .35s ease both}
.qnum{flex-wrap:wrap;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ox);display:flex;justify-content:space-between;gap:10px}
.qtext{font:600 clamp(20px,2.6vw,25px)/1.32 var(--serif);margin:10px 0 22px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:var(--r);padding:14px 16px;font-size:16px;transition:border-color .15s,background .15s,transform .15s;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateX(3px)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;font:700 13px var(--sans);color:var(--ink2)}
.opt.sel{border-color:var(--ink);background:#F4EEDF}
.opt.sel .l{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.right{border-color:var(--good);background:#E6F0E8}
.opt.right .l{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#F6E3DE;animation:shake .35s}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:18px;padding:16px 18px;border-radius:var(--r);border-left:4px solid;animation:vin .3s ease both}
.fb.ok{background:#E6F0E8;border-color:var(--good)}
.fb.no{background:#F6E3DE;border-color:var(--bad)}
.fb.neutral{background:#EFE7D4;border-color:var(--brass)}
.fb b{display:block;font:700 15px var(--sans);margin-bottom:4px}
.rbot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink3)}
input.fill{width:100%;font:500 18px var(--sans);padding:14px 16px;border:1.5px solid var(--rule);border-radius:var(--r);background:#fff}
input.fill:focus{border-color:var(--ink);outline:none}
textarea.essay{width:100%;min-height:170px;font:16px/1.55 var(--sans);padding:14px 16px;border:1.5px solid var(--rule);border-radius:var(--r);background:#fff;resize:vertical}
textarea.essay:focus{border-color:var(--ink);outline:none}
.wc{font-size:13px;color:var(--ink3);text-align:right;margin-top:4px}
.model{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:18px 20px;margin-top:16px;font:400 16.5px/1.55 var(--serif)}
.model h5{margin:0 0 6px;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.checks{display:grid;gap:8px;margin-top:14px}
.checks label{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--rule);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--good);flex:none;margin-top:2px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{background:#fff;border:1.5px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:left;font-size:15px;min-height:48px;display:flex;align-items:center;gap:10px;transition:all .15s}
.mi .tag{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sans);background:var(--paper2);color:var(--ink3)}
.mi.act{border-color:var(--ink);box-shadow:0 0 0 3px rgba(180,138,44,.35)}
.mi.paired .tag{color:#fff}
.mi.right{border-color:var(--good);background:#E6F0E8}
.mi.wrong{border-color:var(--bad);background:#F6E3DE}
.mi:disabled{cursor:default}
.colhead{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* results */
.res{text-align:center;max-width:760px;margin:0 auto}
.res .logo{background:#000;border-radius:10px;padding:10px 24px;display:inline-block;margin-bottom:18px}
.res .logo img{height:64px;display:block}
.ring{width:190px;height:190px;margin:10px auto}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:var(--paper2)}
.ring .val{stroke:var(--sea);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.ring text{font:800 44px var(--serif);fill:var(--ink)}
.res .stamp{display:inline-block;font:italic 700 22px var(--serif);color:var(--ox);border:2.5px solid var(--ox);padding:4px 16px;border-radius:4px;transform:rotate(-4deg);animation:stamp .5s .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(2) rotate(-4deg)}to{opacity:1;transform:scale(1) rotate(-4deg)}}
.review{text-align:left;margin-top:30px;border-top:2px solid var(--ink)}
.rv{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 4px;border-bottom:1px solid var(--rule)}
.rv .m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.rv p{margin:0}
.rv .a{font-size:14px;color:var(--ink2);margin-top:4px}

/* practice hub */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:24px}
.panel h3{font-size:24px;margin-bottom:6px}
.exam{background:var(--ink);color:var(--paper);border-radius:10px;padding:30px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.exam h3{font-size:32px}
.exam p{color:#cbbf9f;margin:6px 0 0}
.exam:before{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border:1px dashed rgba(180,138,44,.5);border-radius:50%;pointer-events:none}
.seg{display:inline-flex;border:1.5px solid var(--brass);border-radius:6px;overflow:hidden;margin-top:14px}
.seg button{background:transparent;border:0;color:var(--paper);padding:8px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--brass);color:#000}

/* game */
.game{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.chart{position:sticky;top:96px;background:#EADFC6;border:2px solid var(--ink);border-radius:8px;position:relative;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.pin circle.o{fill:var(--paper);stroke:var(--ink3);stroke-width:2}
.pin.lit circle.o{fill:var(--ox);stroke:var(--ink)}
.pin text{font:600 13px var(--sans);fill:var(--ink3);opacity:.0;transition:opacity .4s}
.pin.lit text{opacity:1;fill:var(--ink)}
.pin.next circle.o{fill:var(--brass);stroke:var(--ink);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{r:12}}
.route{fill:none;stroke:var(--ox);stroke-width:2.5;stroke-dasharray:7 6}
.ghud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ghud .lives span{font-size:22px;color:var(--ox);margin-right:2px;transition:opacity .3s}
.ghud .lives span.off{opacity:.18}
.gscore{font:800 34px var(--serif);font-variant-numeric:tabular-nums}
.tbar{height:6px;background:var(--paper2);border-radius:6px;overflow:hidden;margin:10px 0 16px}
.tbar i{display:block;height:100%;background:var(--sea);width:100%}
.combo{font:700 12px var(--sans);letter-spacing:.1em;color:var(--brass);text-transform:uppercase}
.gq .qtext{font-size:19px;margin:6px 0 14px}

.float{position:absolute;font:800 22px var(--serif);color:var(--good);pointer-events:none;animation:floatup 1s ease forwards}

/* report */
.bars{display:grid;gap:14px}
.barrow{display:grid;grid-template-columns:200px 1fr 70px;gap:14px;align-items:center}
.barrow .pbar{height:14px}
.weak li{margin:8px 0}
.empty{padding:40px;text-align:center;border:1.5px dashed var(--rule);border-radius:10px;color:var(--ink3)}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:60;padding:20px;animation:vin .2s}
.dialog .box{background:var(--card);border-radius:10px;padding:26px;max-width:420px;width:100%;box-shadow:0 30px 60px -20px #000}
.dialog .box h3{font-size:24px;margin-bottom:8px}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:6px;z-index:70;font-weight:600;animation:vin .3s}
.note{font-size:13px;color:var(--ink2);background:#EFE6D2;border-left:3px solid var(--brass);padding:10px 12px;border-radius:0 4px 4px 0;margin:10px 0 0}
footer{max-width:1180px;margin:0 auto;padding:30px 20px 110px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
footer .fl{background:#000;padding:6px 12px;border-radius:6px}
footer .fl img{height:40px;display:block}


/* read aloud */
.tts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;margin-bottom:24px;position:sticky;top:calc(var(--hh,84px) + 8px);z-index:5;box-shadow:var(--shadow)}
.tts .play{width:46px;height:46px;border-radius:50%;border:0;background:var(--brass);color:#000;display:grid;place-items:center;flex:none;transition:transform .15s}
.tts .play:hover{transform:scale(1.06)}
.tts .play svg{width:20px;height:20px}
.tts .lbl{flex:1;min-width:140px}
.tts .lbl b{display:block;font:600 16px var(--serif)}
.tts .lbl span{font-size:13px;color:#bfb293}
.tts .ic{background:transparent;border:1.5px solid #4a463d;color:var(--paper);border-radius:6px;min-height:40px;padding:0 12px;font-weight:600;font-size:13px}
.tts .ic:hover:not(:disabled){border-color:var(--brass)}
.tts .stoptx{}
@media (max-width:420px){.tts .stoptx{display:none}}
.tts .ic:disabled{opacity:.35;cursor:default}
.tts select{background:#000;color:var(--paper);border:1.5px solid #4a463d;border-radius:6px;min-height:40px;padding:0 8px;font:600 13px var(--sans)}
.tts .wave{display:flex;gap:3px;align-items:flex-end;height:18px}
.tts .wave i{width:3px;background:var(--brass);height:4px;border-radius:2px}
.tts.on .wave i{animation:wv .9s ease-in-out infinite}
.tts.on .wave i:nth-child(2){animation-delay:.15s}.tts.on .wave i:nth-child(3){animation-delay:.3s}.tts.on .wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{50%{height:18px}}
.spk{background:none;border:1.5px solid var(--rule);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;margin-left:auto;color:var(--ink2);flex:none}
.spk:hover{border-color:var(--lc);color:var(--lc)}
.spk svg{width:16px;height:16px}
.reading{background:linear-gradient(90deg,rgba(180,138,44,.22),rgba(180,138,44,.08));box-shadow:-10px 0 0 rgba(180,138,44,.22),10px 0 0 rgba(180,138,44,.08);border-radius:3px;transition:background .3s}
@media (max-width:760px){.tts{padding:8px 10px;gap:8px}.tts .lbl span,.tts .wave{display:none}.tts .lbl{min-width:0}.tts .lbl b{font-size:14px}.tts .play{width:40px;height:40px}.tts select{max-width:92px}}

/* infographics */
.igwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;margin-top:16px}
.igstage{position:sticky;top:calc(var(--hh,84px) + 12px);background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.igframe{position:relative;border-radius:6px;overflow:hidden;background:var(--paper2);aspect-ratio:2752/1536;cursor:zoom-in}
.igframe img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
.igframe img.ld{opacity:1}
.igframe .spin{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:14px}
.focus{position:absolute;border:3px solid var(--brass);border-radius:6px;box-shadow:0 0 0 9999px rgba(20,18,14,.55),0 0 22px rgba(180,138,44,.9);opacity:0;pointer-events:none;transition:left .55s cubic-bezier(.2,.7,.2,1),top .55s cubic-bezier(.2,.7,.2,1),width .55s cubic-bezier(.2,.7,.2,1),height .55s cubic-bezier(.2,.7,.2,1),opacity .35s}
.focus.on{opacity:1}
.focus b{position:absolute;left:-3px;top:-30px;background:var(--brass);color:#000;font:700 12px var(--sans);padding:4px 9px;border-radius:4px 4px 0 0;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.igbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.igbar .cnt{font:600 13px var(--sans);color:var(--ink3);margin-right:auto}
.steps{counter-reset:st;display:grid;gap:8px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:12px;transition:border-color .2s,background .2s}
.step:hover{border-color:var(--ink)}
.step:before{counter-increment:st;content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font:700 12px var(--sans);color:var(--ink2)}
.step b{display:block;font:600 16px/1.25 var(--serif)}
.step span{display:block;font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.5}
.step.reading{background:#F6EBD0;border-color:var(--brass);box-shadow:none}
.step.reading:before{background:var(--brass);color:#000}
.film{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:26px}
.film button{background:none;border:2px solid transparent;border-radius:8px;padding:4px;text-align:left;transition:border-color .2s,transform .2s}
.film button:hover{transform:translateY(-2px)}
.film button[aria-current=true]{border-color:var(--ox)}
.film img{width:100%;aspect-ratio:2752/1536;object-fit:cover;border-radius:5px;display:block;background:var(--paper2)}
.film small{display:block;font:600 13px/1.3 var(--sans);margin-top:6px;color:var(--ink2)}
.film em{font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ox);font-style:normal}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;flex-direction:column;animation:vin .2s}
.lightbox .lbtop{display:flex;gap:8px;align-items:center;padding:10px 14px;color:#eee}
.lightbox .lbtop span{margin-right:auto;font:600 14px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lightbox .lbtop button{background:#222;color:#fff;border:1px solid #444;border-radius:6px;min-width:44px;min-height:44px;font-weight:700}
.lightbox .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:grid;place-items:center}
.lightbox img{width:100%;max-width:none;display:block;transition:width .25s}
.cta-ig{display:inline-flex;align-items:center;gap:10px}
.ignote{font-size:13px;margin-top:10px}
@media (max-width:1060px){.igwrap{grid-template-columns:1fr}.igstage{top:calc(var(--hh,63px) + 6px);z-index:6;padding:6px}.film{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px}}
@media (max-width:760px){.focus b{font-size:11px;top:-26px}.igbar .btn.sm{padding:6px 10px}}
@media (max-width:480px){.igbar .bl{display:none}.igbar .btn.sm{min-width:44px;min-height:40px}.igbar{gap:6px}}

/* ---------- home v2 ---------- */
.hero2{position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 75% 20%,#1F3A35 0%,#10201D 45%,#0B1412 100%);color:#F1E7D3;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:10px;min-height:540px;padding:56px 0 90px 56px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);isolation:isolate;--px:0;--py:0}
.hero2:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at calc(30% + var(--px)*40%) calc(40% + var(--py)*40%),rgba(231,198,111,.18),transparent 45%);transition:background .2s;z-index:-1}
.hero2:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent 0 59px,rgba(180,138,44,.06) 59px 60px),repeating-linear-gradient(90deg,transparent 0 59px,rgba(180,138,44,.06) 59px 60px);z-index:-1;pointer-events:none}
.htxt{position:relative;z-index:2}
.e2{color:#E7C66F!important;display:flex;align-items:center;gap:10px;opacity:0;animation:rise .7s .05s cubic-bezier(.2,.7,.2,1) forwards}
.dotlive{width:8px;height:8px;border-radius:50%;background:#E7C66F;box-shadow:0 0 0 0 rgba(231,198,111,.7);animation:ping 2s infinite;flex:none}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(231,198,111,0)}100%{box-shadow:0 0 0 0 rgba(231,198,111,0)}}
.h2t{font-size:clamp(40px,5.6vw,78px);line-height:.98;font-weight:800;letter-spacing:-.03em;margin-top:16px}
.h2t .w{display:inline-block;opacity:0;transform:translateY(40px) rotate(2deg);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.h2t em{font-style:italic;font-weight:400;color:#E7C66F;background:linear-gradient(90deg,#E7C66F,#F6E2A6,#B48A2C,#E7C66F);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rise .9s .7s cubic-bezier(.2,.8,.2,1) forwards,shine 6s 1.6s linear infinite}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
.brush{display:block;width:min(360px,70%);height:14px;margin:10px 0 0;overflow:visible}
.brush path{fill:none;stroke:#9A3324;stroke-width:5;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1s 1.1s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lede2{font:400 clamp(17px,1.6vw,20px)/1.55 var(--serif);color:#D9CCAE;max-width:40ch;margin:18px 0 26px;opacity:0;animation:rise .8s 1s ease forwards;transform:translateY(16px)}
.hero2 .actions{display:flex;gap:12px;flex-wrap:wrap;opacity:0;animation:rise .8s 1.2s ease forwards;transform:translateY(16px)}
.btn.big{min-height:52px;padding:14px 22px;font-size:16px}
.btn.brass .arr{display:inline-block;transition:transform .2s}
.btn.brass:hover .arr{transform:translateX(5px)}
.btn.brass.big{box-shadow:0 10px 30px -10px rgba(231,198,111,.6)}
.btn.glass{background:rgba(241,231,211,.08);border-color:rgba(241,231,211,.35);color:#F1E7D3;backdrop-filter:blur(4px)}
.btn.glass:hover{background:rgba(241,231,211,.18);border-color:#E7C66F}
.hprog{display:flex;align-items:center;gap:14px;margin-top:30px;opacity:0;animation:rise .8s 1.4s ease forwards;transform:translateY(16px)}
.hprog svg{width:62px;height:62px;flex:none;transform:rotate(-90deg)}
.hprog circle{fill:none;stroke-width:7}
.hprog .t{stroke:rgba(241,231,211,.12)}.hprog .v{stroke:#E7C66F;stroke-linecap:round;transition:stroke-dashoffset 1.8s 1.4s cubic-bezier(.2,.7,.2,1)}
.hprog b{display:block;font:700 22px var(--serif);font-variant-numeric:tabular-nums}
.hprog b span{font:inherit;color:inherit}
.hprog span{font-size:13px;color:#B9AC8C}
.hscene{position:relative;z-index:1;align-self:stretch;display:flex;align-items:center;padding-right:24px}
.scene{width:100%;height:auto;overflow:visible}
.scene .star{fill:#F6EEDB;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
.lay-stars{transform:translate(calc(var(--px)*-10px),calc(var(--py)*-8px));transition:transform .4s ease-out}
.lay-rose{transition:transform .4s ease-out}
.lay-rose .spin2{animation:spin 120s linear infinite}
.scene .route-bg{fill:none;stroke:rgba(231,198,111,.18);stroke-width:2}
.scene .route-draw{fill:none;stroke:#E7C66F;stroke-width:2.2;stroke-dasharray:6 7;stroke-dashoffset:0;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.scene .port text{font:700 13px var(--sans);fill:#F1E7D3;letter-spacing:.04em}
.scene .port .yr{font:600 10px var(--sans);fill:#E7C66F;letter-spacing:.16em}
.scene .port circle:first-child{animation:pulse2 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.scene .p2 circle:first-child{animation-delay:1.2s}
@keyframes pulse2{50%{transform:scale(1.5);opacity:.5}}
.scene .ocean{font:italic 600 22px var(--serif);fill:rgba(241,231,211,.22);letter-spacing:.4em}
.scene .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:scale(1.3) rotate(-3deg) translateY(0)}50%{transform:scale(1.3) rotate(3deg) translateY(-3px)}}
.scene .sl{animation:billow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes billow{50%{transform:scaleX(1.06)}}
.waves{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:1;pointer-events:none}
.wv{position:absolute;left:0;bottom:0;width:200%;height:60px}
.wv path{fill:#2D5B55}
.wv1{opacity:.35;animation:wave 14s linear infinite;bottom:22px}
.wv2{opacity:.55;animation:wave 10s linear infinite reverse;bottom:10px}
.wv3 path{fill:var(--paper)}.wv3{animation:wave 18s linear infinite;bottom:-2px}
@keyframes wave{to{transform:translateX(-50%)}}
/* timeline */
.tl{margin:26px 0 0}
.tlhead{margin-bottom:10px}
.tltrack{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tlrow{display:flex;gap:12px;width:max-content;animation:marquee 70s linear infinite;padding:4px 0 8px}
.tltrack:hover .tlrow,.tltrack:focus-within .tlrow{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
.tlc{flex:none;width:200px;text-align:left;background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--lc);border-radius:10px;padding:12px 14px;transition:transform .25s,box-shadow .25s}
.tlc:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:var(--shadow)}
.tlc b{display:block;font:800 26px/1 var(--serif);color:var(--lc)}
.tlc span{display:block;font-size:14px;line-height:1.3;margin:6px 0 8px;min-height:36px}
.tlc i{font:700 10px var(--sans);letter-spacing:.14em;color:var(--ink3);font-style:normal}
/* stats */
.stats2{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.st2{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px;position:relative;overflow:hidden;transition:transform .25s}
.st2:hover{transform:translateY(-3px)}
.st2 i{position:absolute;right:12px;top:6px;font:400 44px var(--serif);color:var(--brass);opacity:.22;font-style:normal}
.st2 b{display:block;font:800 36px/1 var(--serif);font-variant-numeric:tabular-nums}
.st2 span{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
/* bento */
.bento{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:auto auto;gap:16px}
.bt{position:relative;overflow:hidden;text-align:left;border:1px solid var(--rule);border-radius:16px;padding:22px;background:var(--card);display:flex;flex-direction:column;justify-content:flex-end;gap:12px;min-height:200px;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.bt:hover{transform:translateY(-5px);box-shadow:0 24px 40px -24px rgba(28,26,22,.55);border-color:var(--ink)}
.bt em{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ox);font-style:normal}
.bt h3{font-size:24px;margin:4px 0 4px}
.bt p{margin:0;color:var(--ink2);font-size:15px}
.b-ig{grid-row:span 2;background:linear-gradient(160deg,#1C1A16,#3A2A1C);color:var(--paper);border-color:#1C1A16;min-height:420px;justify-content:space-between}
.b-ig p{color:#CDBF9E}.b-ig em{color:#E7C66F}
.b-ig .go{display:inline-block;margin-top:10px;font-weight:700;color:#E7C66F;transition:transform .2s}
.b-ig:hover .go{transform:translateX(6px)}
.fan{position:relative;height:230px;margin-top:10px}
.fan img{position:absolute;left:50%;top:50%;width:78%;border-radius:8px;box-shadow:0 18px 30px -12px #000;border:3px solid #F1E7D3;transform:translate(-50%,-50%) rotate(calc((var(--i) - 1)*7deg)) translateX(calc((var(--i) - 1)*14px));transition:transform .6s cubic-bezier(.2,.8,.2,1);animation:fanfloat 6s ease-in-out infinite;animation-delay:calc(var(--i)*-2s)}
.b-ig:hover .fan img{transform:translate(-50%,-50%) rotate(calc((var(--i) - 1)*14deg)) translateX(calc((var(--i) - 1)*70px)) translateY(calc(var(--i)*-4px))}
@keyframes fanfloat{50%{margin-top:-6px}}
.b-game{background:linear-gradient(170deg,#E6EFE9,#FBF6EA)}
.mini-ship{width:120px;height:70px}
.mini-ship .mwv{fill:#2D5B55;opacity:.5;animation:wave2 3s linear infinite}
@keyframes wave2{to{transform:translateX(-30px)}}
.mini-ship .mbob{animation:bob2 2.4s ease-in-out infinite;transform-origin:60px 45px}
@keyframes bob2{50%{transform:rotate(4deg) translateY(-2px)}}
.watch{width:60px;height:60px}
.watch circle{fill:none;stroke:var(--ink);stroke-width:3}
.watch rect{fill:var(--ox)}
.watch .hand{stroke:var(--ox);stroke-width:3;stroke-linecap:round;transform-origin:30px 32px;animation:spin 6s steps(60) infinite}
.b-exam{background:linear-gradient(170deg,#F4E2DC,#FBF6EA)}
.flipdemo{perspective:400px;width:70px;height:50px}
.flipdemo .fi{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flipy 4s ease-in-out infinite}
.flipdemo .ff,.flipdemo .fb2{position:absolute;inset:0;border-radius:6px;display:grid;place-items:center;font:800 20px var(--serif);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipdemo .ff{background:#fff;border:2px solid var(--ink)}.flipdemo .fb2{background:var(--ink);color:#E7C66F;transform:rotateY(180deg)}
@keyframes flipy{0%,35%{transform:rotateY(0)}50%,85%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.b-flash{background:linear-gradient(170deg,#F3EAD2,#FBF6EA)}
.sheets{position:relative;width:70px;height:56px}
.sheets i{position:absolute;width:44px;height:54px;background:#fff;border:2px solid var(--ink);border-radius:4px;left:0;top:0;transition:transform .4s}
.sheets i:nth-child(2){transform:translate(10px,-2px) rotate(6deg)}.sheets i:nth-child(3){transform:translate(20px,-4px) rotate(12deg);background:linear-gradient(#fff 0 30%,var(--brass) 30% 34%,#fff 34% 50%,var(--brass) 50% 54%,#fff 54%)}

.b-ws{background:linear-gradient(170deg,#E9E3D2,#FBF6EA)}
/* fact */
.fact{position:relative;overflow:hidden;margin-top:28px;background:var(--ink);color:var(--paper);border-radius:16px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border-left:6px solid var(--fc,var(--brass));transition:border-color .4s}
.fact [data-fq]{font:600 clamp(19px,2.2vw,25px)/1.3 var(--serif);margin:8px 0 0}
.fact .fa{font:400 17px/1.5 var(--serif);color:#E7C66F;margin:10px 0 0;max-height:0;opacity:0;overflow:hidden;transition:max-height .6s ease,opacity .6s ease}
.fact.rev .fa{max-height:200px;opacity:1}
.fact.run [data-fq]{animation:rise .6s ease both;transform:translateY(10px);opacity:0}
.factbtns{display:flex;flex-direction:column;gap:8px}
.fbar{position:absolute;left:0;bottom:0;height:3px;background:var(--brass);width:0}
.fact.run .fbar{animation:fbar 11s linear forwards}
@keyframes fbar{to{width:100%}}
/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

@media (max-width:960px){

// ───────────── LESSON 4 ─────────────
{id:'w2cw',lesson:'l4',kind:'Classwork',week:'Week 2',title:'Spain Builds an American Empire',
 src:'G8_ESS_W_2_C_W_M.16_L4_Spain_Builds_an_American_Empire.pdf',
 note:'Two questions appear twice in the PDF ("What did the Aztecs think the Spanish people were?" and "What inspired Christopher Columbus’s 1492 voyage?"). Each is included once here.',
 qs:[
 ESSAY('What role did mestizos play in Spanish colonies?',
  'Mestizos were people of mixed Spanish and Native American ancestry. Relationships between Spanish men and Indigenous women created a large mestizo population, which became a major social group in the Spanish colonies — below the Spanish-born settlers (peninsulares) but above enslaved and Native peoples — and blended Spanish and Native cultures.',
  ['Mixed Spanish (European) and Native American ancestry','Formed a large / major social group in the colonies','Ranked below Spanish-born settlers in colonial society','Blended Spanish and Native cultures']),
 MC('Why did Columbus call the natives “Indians”?',['They told him they were from India.','He wanted to give them a new name.','He believed they were from India.','Spain had already named them “Indians.”'],2,'Columbus believed he had reached the Indies (Asia), so he called the Taíno people “Indians.”'),
 MC('Why did Montezuma II give gold to Cortés?',['He wanted to become rich through trade with Spain.','Spanish farmers who settled in Europe','He wanted to help Cortés conquer the Aztec Empire.','He hoped the gold serving as ransom would persuade Cortés and the Spanish to leave.'],3,'Montezuma hoped the gold would persuade Cortés and the Spanish to leave. It only made them want more.'),
 MC('Who were the Aztecs?',['European settlers who came to Mexico','Native American leaders who lived in South America','A powerful Indigenous civilization that lived in central Mexico','Spanish farmers who settled in Europe'],2,'The Aztecs were a powerful Indigenous empire in central Mexico with their capital at Tenochtitlan.'),
 ESSAY('What was the encomienda system?',
  'The encomienda was a Spanish colonial system that gave Spanish colonists (landlords) the right to force Native Americans to work on farms, ranches, plantations and in mines. Landlords promised to treat workers fairly and teach them Christianity, but abuse, overwork and dangerous mining killed many. After criticism from Bartolomé de Las Casas, Spain abolished it in 1542.',
  ['Spanish colonial system / grant from the Spanish Crown','Forced Native Americans to labor','Work on farms, plantations or in mines','Promised protection & Christianity, but brutal abuse and many deaths']),
 ESSAY('Why was Atahualpa executed despite paying ransom?',
  'Pizarro captured the Inca emperor Atahualpa, who offered a room filled once with gold and twice with silver for his freedom. Even after the ransom was paid, the Spanish executed him because they feared he would lead the Inca against them if released, and because removing the emperor left the Inca Empire leaderless and easier to conquer and plunder.',
  ['Atahualpa was captured by Pizarro','Paid a ransom of a room of gold and silver','Spanish feared he would lead a rebellion if freed','Killing the emperor weakened the Inca and helped the Spanish take control']),
 MC('How did priests contribute to colonization?',['They taught Christianity to Indigenous people.','They helped Indigenous people build armies.','They stopped European exploration.','They traded sugar with Europe.'],0,'Spanish priests set up missions and converted Indigenous people to Christianity.'),
 MC('What did the Aztecs think the Spanish people were?',['Peaceful traders','Native American warriors','African explorers','Gods or supernatural beings'],3,'Montezuma II at first believed Cortés might be an armor-wearing god.'),
 MC('Who were the conquistadors?',['Spanish explorers and soldiers who conquered lands in the Americas','Native American leaders who fought against Spain','European merchants who traded with Asia','Spanish farmers who settled in Europe'],0,'Conquistadors were Spanish conquerors seeking land, gold and glory in the Americas.'),
 MC('What inspired Christopher Columbus’s 1492 voyage?',['To discover a new continent for Spain','To find a westward route to Asia and gain wealth and trade opportunities','To establish colonies in Africa','To search for gold in Europe'],1,'Columbus sailed west hoping to reach Asia for trade and wealth.'),
]},
{id:'w2hw',lesson:'l4',kind:'Homework',week:'Week 2',title:'Spain Builds an American Empire — European Nations Settle North America',
 src:'G8_ESS_2_HW_M16_L.4_Spain_Builds_an_American_Empire_-_European_Nations_Settle_North_America.pdf',
 note:'“Why did Atahualpa meet Pizarro peacefully?” appears twice in the PDF and is included once. Two questions have mislabelled answer letters in the PDF; the answer text here is exactly as printed.',
 qs:[
 MC('Who was Las Casas?',['A conquistador','A Spanish settler','A priest and critic','A governor'],2,'Bartolomé de Las Casas was a Dominican priest who criticized the brutal treatment of Native Americans.'),
 MC('Who led the Pueblo Revolt?',['Popé','Pizarro','Montezuma','Las Casas'],0,'Popé led the 1680 Pueblo Revolt and drove the Spanish out of Santa Fe for 12 years.'),
 MC('Why did Atahualpa meet Pizarro peacefully?',['To offer gold','To attack him','He did not expect a fight','To convert him'],2,'Atahualpa commanded about 30,000 warriors against Pizarro’s ~200 men, so he did not expect a fight and was ambushed.'),
 MC('What did the encomienda system involve?',['Forced labor by natives','Missionary schools','Spanish elections','Farming for profit'],0,'Encomienda forced Native Americans to work for Spanish landlords.'),
 MC('What crop became Brazil’s main export?',['Sugar','Cotton','Corn','Gold'],0,'Sugar plantations became the foundation of Portuguese Brazil’s economy.'),
 MC('Why did England, France, and the Netherlands become interested in the Americas?',['They wanted to help Spain','They were jealous of Spain’s colonial success','They wanted to avoid trade','They wanted to leave Europe'],1,'Spain’s wealth from its American empire made rival nations want colonies of their own.'),
 MC('What did the Treaty of Tordesillas do in 1494?',['They wanted to help Spain','Ended the fur trade','Divided the Americas between Spain and Portugal','Gave North America to the Netherlands'],2,'The treaty divided newly found lands outside Europe between Spain and Portugal.'),
 MC('What was the result of Spanish conquest on native empires?',['Expansion','Peace treaties','Destruction','Industrial growth'],2,'The Aztec and Inca empires were destroyed by Spanish conquest.'),
 MC('Why did England, France, and the Netherlands ignore the Treaty of Tordesillas?',['They wanted to help Portugal','They wanted to build their own empires','Divided the Americas between Spain and Portugal','They had no interest in North America'],1,'They ignored the treaty to build their own colonial empires and trade routes.'),
 MC('Which city did Pizarro found?',['Santa Fe','Mexico City','Lima','Veracruz'],2,'Pizarro founded Lima in 1535 as the capital of Spanish Peru.'),
 MC('What were bandeiras?',['Sugar plantations','Slave-hunting groups','Portuguese ships','Christian missions'],1,'Bandeiras were slave-hunting expeditions into Brazil’s interior.'),
 MC('What was Giovanni da Verrazzano searching for in 1524?',['Religious freedom','Sugar plantations','Gold mines','A Pacific sea route'],3,'Verrazzano was looking for a sea route to the Pacific through North America.'),
 MC('What important place did Giovanni da Verrazzano from France discover?',['Boston Harbor','Syria','New York Harbor','Pacific oceans'],2,'Sailing for France, Verrazzano reached New York Harbor in 1524.'),
 MC('What colony was founded by English settlers in 1607?',['Jamestown','Syria','New York Harbor','Quebec'],0,'Jamestown, Virginia (1607) was the first permanent English settlement.'),
]},
{id:'w3mock',lesson:'l4',kind:'Mock Quiz',week:'Week 3',title:'Module 16 Lessons 4 & 5 — Mock Quiz',
 src:'G8_ESS_W3_CW2_Module_16_Lessons_45__Mock_Quiz__.pdf',
 note:'Q2 (matching): the answer cards were not visible in the PDF, so the region cards here come from the textbook facts in the study guides. Q17 is worded as printed, but in the study guides Metacom’s war (King Philip’s War, 1675) was fought against English colonists in New England.',
 qs:[
 MC('Where did the Dutch claim land/build colony in North America',['Hudson\'s Waterways','Louisiana','Ohio Valley','St Lawrence River'],0,'Henry Hudson explored the waterways for the Dutch, who founded New Netherland there.'),
 MATCH('Match each explorer with the regions/countries they explored',[['Jacques Cartier','St. Lawrence River (Montreal)'],['Samuel De Champlain','Quebec'],['Giovanni Da Verazzano','New York Harbor'],['Pedro Cabral','Brazil']],[],'Cartier sailed the St. Lawrence and named Mont Real. Champlain founded Quebec. Verrazzano reached New York Harbor. Cabral claimed Brazil for Portugal.'),
 MC('what was the name of the system that was used to force Native Americans into forced labor on plantations?',['mestizo','bandeiras','conquistador','encomienda'],3,'The encomienda system forced Native Americans to work for Spanish landlords.'),
 MC('Who explored North America for Netherlands, looking for a sea route to the Pacific?',['La Salle','Henry Hudson','Verrazzano','Marquette'],1,'Henry Hudson sailed for the Dutch.'),
 MC('Who did British take the colony New York from?',['Netherlands','Spain','Native Americans','France'],0,'In 1664 the English took New Netherland from the Dutch and renamed it New York.'),
 MC('Which European explorer is credited for circumnavigating (circling) the globe, despite getting killed on the journey back home?',['Henry Hudson','Ferdinand Magellan','Francisco Pizzaro','Vasco Nunez de Balboa'],1,'Magellan’s expedition circled the globe, but Magellan was killed during the voyage.'),
 MC('Who was the Aztec emperor at the time of Cortés’s arrival?',['Atahualpa','Montezuma II','Popé','Pedro Alvarez Cabral'],1,'Montezuma II ruled the Aztecs when Cortés arrived in 1519.'),
 MC('What year did Columbus discover America?',['1607','1492','1592','1500'],1,'Columbus reached the Caribbean in 1492.'),
 MC('Which French explorer gave Montreal its name?',['Jacques Cartier','Samuel De Champlain','Louis XIV','La Salle'],0,'Jacques Cartier named the site Mont Real (Montreal).'),
 MC('Which Native American tribe did Columbus encounter when he first discovered America and thought they were Indians?',['Inca','Aztec','Taino','Massachusett'],2,'Columbus met the Taíno people in the Caribbean.'),
 MC('what good/resource turns Jamestown to a profitable settlement for the British',['Gold','Fur','Cotton','Tobacco'],3,'Tobacco became Jamestown’s profitable cash crop.'),
 ESSAY('How was the English treatment of Native Americans different from the French or Dutch treatment? What did English prioritize in their dealings with the Natives, and what consequences did it lead to?',
  'The French and Dutch mainly wanted the fur trade, so they built trading partnerships with Native Americans and took less land. The English came to settle and farm (for example tobacco in Jamestown), so they prioritized taking land for farms and towns. This pushed Native Americans off their land and led to violent conflicts such as King Philip’s War (1675), led by Metacom.',
  ['French & Dutch focused on the fur trade and partnership with Natives','English focused on settling and farming the land','English took Native land as colonies grew','Led to wars / conflict (e.g., King Philip’s War with Metacom)']),
 MC('What good/resource did Spanish seek the most in their explorations?',['Tobacco','Gold','Cotton','Sugar'],1,'Spanish conquistadors sought gold (and silver) above all.'),
 MC('what term is used to describe a person of mixed ancestry from Native and European parents?',['Encomienda','Mestizo','Bandeirantes','Puritan'],1,'Mestizos were of mixed Spanish/European and Native American ancestry.'),
 ESSAY('What were the European countries exploring the North American continent was initially looking to find? Did they find it? and what was/were the consequences of their exploration?',
  'Explorers such as Verrazzano, Cartier and Henry Hudson were looking for a sea route through North America to the Pacific and Asia (the Northwest Passage). They did not find it. Their exploration led to claims and colonies: New France (Quebec, the fur trade), New Netherland (later New York) and English colonies. These colonies brought rivalry between European nations and conflict with Native Americans.',
  ['Looking for a sea route to the Pacific / Asia (Northwest Passage)','They did not find it','Led to colonies (New France, New Netherland, English colonies)','Led to rivalry / wars and conflict with Native Americans']),
 ESSAY('Give at least 3 reasons why Spanish defeated Native American empires in the Americas, and explain how these reasons made difference',

{id:'w3hw6',lesson:'l6',kind:'Homework',week:'Week 3',title:'The Atlantic Slave Trade',
 src:'G8_ESS_W_3_HW_Module_16_Lesson_6_The_Atlantic_Slave_Trade.pdf',
 qs:[
 MC('Which 2 European countries got involved in the Atlantic Slave Trade first?',['England-Spain','France-Spain','England-France','Spain-Portugal'],3,'Spain and Portugal were the first and largest traders in the early period.'),
 MC('Why does the topic "The Atlantic Slave Trade" matter now?',['Descendants of the enslaved Africans make up a large portion of the population of the Americas today and have great impact on the culture','Because it is still ongoing today','Because the same thing is happening to Native Americans today after the Africans','Because the impact of slavery and plantations/farms on the global economy is huge'],0,'Descendants of enslaved Africans make up a large part of the population of the Americas and have shaped its culture.'),
 MC('which one of these factors was NOT a reason why the Europeans chose Africans for slavery?',['Skin Color','Slavery was already large scale and brutal in Africa','Farming Skills','Immunity to European diseases'],1,'Slavery did exist in Africa, but it was different and was not one of the listed reasons. Europeans pointed to disease immunity, farming skills and the ease of identifying people by skin color.'),
 TF('Slavery already existed in Africa before the Europeans arrived',true,'True. Slavery existed in Africa for centuries, but the system in the Americas became racial, lifelong and hereditary.'),
 ESSAY('Explain the concepts of "Indentured Servitude", and "The Atlantic Slave Trade". Then compare both and explain the main differences',
  'Indentured servitude: poor Europeans who could not pay for the trip to America agreed to work for a set number of years (about 4–7) on plantations. After that they were free. The Atlantic Slave Trade: millions of Africans were captured, shipped across the Atlantic (the Middle Passage) and sold at auctions to work for life. Differences: indentured servitude was voluntary, temporary and not hereditary. Slavery was forced, lifelong and passed on to children. Enslaved people were treated as property with no rights, and the treatment was far more brutal.',
  ['Indentured servitude = voluntary contract for set years to pay passage','Slave trade = Africans captured, shipped and sold by force','Servitude temporary vs slavery lifelong & hereditary','Enslaved people treated as property / no rights, much harsher treatment']),
 MC('Which European country became the leading slave trading country in the 18th century?',['France','Netherlands','England','Spain'],2,'England (Britain) dominated the trade from about 1690 to 1807.'),
 ESSAY('Explain the role of the Africans or African leaders in the trade. Did they take part in the trade? What did they do?',
  'Yes. Some African rulers and merchants took part in the trade. They captured people, often from rival groups through war and raids, and sold them to European traders on the coast in exchange for guns, weapons, gold, cloth and other goods. Others opposed the trade. Over time it tore families apart, took away young people, and the guns changed the balance of power between African kingdoms.',
  ['Yes — some African rulers and merchants participated','They captured people (often rivals) and sold them to Europeans','In exchange for guns/weapons, gold and goods','Some opposed it; it weakened and destabilized African societies']),
 MC('What was the ocean voyage that brought captured Africans across the Atlantic called?',['The Triangular Trade','Middle Passage','Auctions','The Atlantic Slave Trade'],1,'The Middle Passage was the forced voyage across the Atlantic.'),
 MC('Which one of these areas did captured Africans NOT work in?',['Military','Mines','Plantations/Farms','Homes'],0,'Enslaved Africans were forced to work on plantations, in mines and in homes, not as soldiers.'),
 ESSAY('Who is Olaudah Equiano? what did he experience? and what is his legacy?',
  'Olaudah Equiano was an African who was kidnapped as a child, enslaved and carried across the Atlantic on the Middle Passage. He described the terrible conditions: the stench, crowding, heat, sickness, whippings and being forced to eat. He later gained his freedom and wrote an autobiography. His legacy is a powerful first-hand primary source about the slave trade that helped the movement to end slavery.',
  ['Enslaved African, kidnapped and taken on the Middle Passage','Described crowding, stench, disease, beatings, forced eating','Later gained freedom and wrote an autobiography','Legacy: key primary source; helped the anti-slavery movement']),
 MC('One of the rebellions against the brutal conditions of slavery in the Americas was called .......',['Slave Rebellion','Stono Rebellion','Philip\'s Rebellion','Olaudah\'s Rebellion'],1,'The Stono Rebellion took place in South Carolina in 1739.'),
 MC('Where were the captured slaves sold in the colonies?',['Plantations','Markets','Auctions','Ports'],2,'Captives were sold at auctions.'),
]},

 qs:[

 MC('What is the name of the sea voyage (trip) that brought enslaved Africans to the Americas',['The Triangular Passage','Auctions','Middle Passage','The Triangular Trade'],2,'The Middle Passage.'),
 FILL('African rulers and merchants captured and sold enslaved Africans to Europeans in exchange for ________',['weapons','weapon','guns','gun','firearms','gold','goods','weapons and gold','guns and gold','cloth','rum'],'weapons (guns), gold and other European goods','Europeans paid with guns, gold, cloth, rum and other goods.'),
 ESSAY('In a paragraph, explain why the European nations needed slaves, why they chose Africans, and how their treatment towards the enslaved Africans was different from other systems of labors like the Encomienda and Indentured Servitude. Make sure your paragraph answers all 3 questions!',
  'Europeans needed huge numbers of workers for sugar and tobacco plantations and mines, and millions of Native Americans had died from European diseases and forced labor. They chose Africans because they had immunity to European diseases, farming skills, did not know the land (so escape was hard) and could be identified by skin color. Enslaved Africans were treated far worse than workers in other systems: they were legal property, enslaved for life, and their children were born into slavery. Indentured servants volunteered and were freed after a few years. Native Americans under encomienda were forced to work but were not legally owned as property.',
  ['Needed labor for plantations/mines; Native population had died from disease','Chose Africans: immunity, farming skills, didn’t know the land, skin color','Slavery: property, lifelong, hereditary, extreme brutality','Compare: indentured = voluntary & temporary; encomienda = forced but not owned']),
]},
{id:'w4cw6',lesson:'l6',kind:'Classwork',week:'Week 4',title:'The Atlantic Slave Trade — Textbook Reading Tasks',
 src:'G8_ESS_CW_M16_L6_The_Atlantic_Slave_Trade.pdf',
 note:'Three of these questions refer to textbook pages 652, 655 and 656. The textbook itself was not among the uploads, so the model answers are based on the study guides.',
 qs:[
 ESSAY('Take a look at the memory of Olaudah Equiano on page 655, where he talks about the conditions of his "middle passage" he witnessed. Answer the two questions: 1- Why might the white men have forced Equiano to eat? 2- What does the diagram of the ship suggest about the conditions on board?',
  '1) The crew forced captives to eat to keep them alive and healthy enough to be sold for a profit in the Americas. A captive who died was lost money for the traders, not someone they cared about. 2) The ship diagram shows people packed tightly side by side with almost no space, which suggests extreme overcrowding, filth, little air, heat and disease, so many died (about 20% per voyage).',
  ['Forced to eat to keep them alive for sale / profit','Captives were seen as property (cargo), not people','Diagram shows extreme overcrowding — packed tightly','Conditions: filth, little air, heat, disease, many deaths']),
 ESSAY('Read the "Consequences of The Atlantic Slave Trade" on page 656. Explain in detail why the topic is important today, and what the legacy of the Atlantic Slave Trade is.',
  'About 9.5 million Africans were brought to the Americas. Their descendants make up a large part of the population of the Americas and have shaped its food, music, art, religion and culture. The trade also tore African families apart, took generations of young people from Africa and spread guns that changed power in African kingdoms. Its legacy includes racism and inequality that people still work to overcome today, which is why it matters now.',
  ['Millions of Africans forcibly moved (≈9.5 million)','Descendants shaped culture of the Americas (music, food, art)','Devastated African societies — families, young leaders, guns','Ongoing legacy: racism/inequality; importance of remembering']),
 MATCH('Match each description with the correct term',[['Name of the sea journey (voyage) that brought enslaved Africans to the Americas','Middle Passage'],['Name of the trading network that enslaved people were a part of','The Triangular Trade'],['Name of the labor system that was for poor workers who willingly agreed to work set number of years in exchange for settling in the Americas','Indentured Servitude'],['Name of the resource/good farms where the enslaved Africans were made to work','Plantation']],['Encomienda'],'Encomienda is the extra card. It was forced Native American labor under Spanish rule.'),
 ESSAY('Take a look at the "Systems of Labor" paragraph on page 652 of your textbook. Explain the Atlantic Slave Trade as a system of labor, compare it to other systems of labor like the "encomienda" and "Indentured Servitude". How were they different or similar to each other? and how was the treatment of workers different in each system?',
  'All three systems supplied workers for colonial farms and mines. Atlantic slavery: Africans were forced, owned as property, enslaved for life and their children were born enslaved, with brutal treatment and no rights. Encomienda: Spanish landlords forced Native Americans to work. The workers were not legally owned and were promised protection and Christianity, but they were badly abused. Indentured servitude: poor Europeans chose to work 4–7 years to pay for their passage and were freed afterwards. Similar: all provided cheap labor for colonies. Different: how voluntary each was, how long it lasted, and whether people were owned.',
  ['Similar: all supplied labor for colonial plantations/mines','Slavery: forced, property, lifelong, hereditary, brutal','Encomienda: forced Native labor but not legal ownership','Indentured: voluntary, 4–7 years, freed after']),
]},

{id:'l4',code:'M16 · L4',short:'Spain’s American Empire',title:'Spain Builds an American Empire & European Nations Settle North America',
 years:'1492 – 1763',color:'#9A3324',
 objectives:['Explain why Columbus sailed and why he called the Taíno “Indians”.','Describe how Cortés and Pizarro conquered the Aztec and Inca empires.','Explain the encomienda system and the people who opposed it.','Compare how Spain, Portugal, France, the Netherlands and England built colonies.'],
 sections:[
  {h:'Columbus, 1492',p:['Columbus sailed west to find a sea route to Asia for trade and wealth. His three ships were the Niña, Pinta and Santa María.','He landed in the Caribbean and called the Taíno people “Indians” because he believed he had reached the East Indies.','The continent was later named after Amerigo Vespucci.']},
  {h:'The conquistadors',p:['Hernán Cortés landed in Mexico in 1519 and conquered the Aztec Empire (capital: Tenochtitlan). Emperor Montezuma II at first thought Cortés might be a god. He offered gold, hoping the Spanish would leave, but Cortés took him hostage.','Francisco Pizarro entered Peru in 1532 with about 200 men, ambushed and captured the Inca emperor Atahualpa (who had about 30,000 warriors), and took Cuzco in 1533.','Atahualpa offered a room filled once with gold and twice with silver as ransom. The Spanish executed him anyway. Pizarro founded Lima in 1535.','The Spanish won because of disease (smallpox), steel weapons, guns and horses, alliances with Native enemies of the Aztecs, and capturing the emperors.']},
  {h:'Colonial society & labor',p:['Encomienda: the Crown gave colonists the right to force Native Americans to work on farms, ranches and in mines. Landlords promised fair treatment and Christianity, but abuse and overwork killed many.','Spanish-born settlers were called peninsulares. Children of Spanish and Native American parents were mestizos, who became a large social group.','Bartolomé de Las Casas, a Dominican priest, criticized the encomienda. Spain abolished it in 1542.','Popé led the Pueblo Revolt of 1680, which drove the Spanish out of Santa Fe, New Mexico, for 12 years.']},
  {h:'Portugal & Brazil',p:['The Treaty of Tordesillas (1494) divided newly found lands between Spain and Portugal. Pedro Cabral claimed Brazil for Portugal.','Sugar became Brazil’s main export. Bandeiras were slave-hunting groups that raided the interior to capture Indigenous people.']},
  {h:'Rivals in North America',p:['England, France and the Netherlands, jealous of Spain’s success, ignored the treaty to build their own empires.','France: Verrazzano reached New York Harbor (1524) looking for a Pacific sea route. Cartier explored the St. Lawrence and named Montreal. Champlain founded Quebec (1608). New France was built on the fur trade with Native partners.','Netherlands: Henry Hudson explored the waterways for the Dutch, who founded New Netherland. The English took it in 1664 and renamed it New York.','England: Jamestown, Virginia (1607) became profitable through tobacco. Pilgrims (Plymouth, 1620) and Puritans came for religious freedom. Colonies were funded by joint-stock companies.','Conflicts: King Philip’s War (1675), led by Metacom. The French and Indian War (1754–1763) began over the Ohio Valley, and Britain won control of eastern North America.']},
 ],
 terms:[['Conquistador','Spanish conqueror / soldier-explorer in the Americas'],['Encomienda','Spanish system forcing Native Americans to labor'],['Mestizo','Person of mixed Spanish & Native American ancestry'],['Peninsulares','Spanish-born settlers in the colonies'],['Bandeiras','Portuguese slave-hunting groups in Brazil'],['Treaty of Tordesillas','1494 treaty dividing new lands: Spain & Portugal'],['Pueblo Revolt','1680 uprising led by Popé in New Mexico'],['King Philip’s War','1675 war led by Metacom against English colonists']],
},
{id:'l6',code:'M16 · L6',short:'The Atlantic Slave Trade',title:'The Atlantic Slave Trade & Systems of Labor',
 years:'1500s – 1870',color:'#5A4636',
 objectives:['Explain why Europeans turned to enslaved African labor.','Describe the Triangular Trade and the Middle Passage.','Compare slavery, indentured servitude and the encomienda.','Explain how enslaved Africans resisted, and the legacy of the trade.'],
 sections:[
  {h:'Why the trade grew',p:['Sugar and tobacco plantations and mines needed huge numbers of workers. Millions of Native Americans had died from European diseases (smallpox, measles), war and forced labor.','Europeans turned to Africans, pointing to their immunity to European diseases, their farming skills, the fact that they did not know the land (making escape harder), and skin color that made them easy to identify.','Slavery already existed in Africa, but the system in the Americas became racial, lifelong and hereditary.']},
  {h:'Who traded',p:['Spain and Portugal were involved first. Portugal carried huge numbers of people to Brazil’s sugar plantations.','England became the leading slave-trading nation in the 1700s (about 1690–1807).','Some African rulers and merchants captured and sold people in exchange for guns, gold, cloth and other goods. Others opposed the trade.','About 9.5 million Africans had been brought to the Americas by 1870: roughly 40% to the Caribbean and 38% to Brazil, the last country in the Americas to abolish slavery.']},
  {h:'The Triangular Trade & Middle Passage',p:['Leg 1, Europe to West Africa: manufactured goods, cloth, guns and rum.','Leg 2, West Africa to the Americas: enslaved Africans. This voyage is the Middle Passage.','Leg 3, the Americas to Europe: cash crops such as sugar, tobacco, coffee and molasses.','On the Middle Passage captives were packed tightly into filthy holds with little food or air. About 20% died on each voyage. Survivors were sold at auctions.']},
  {h:'Olaudah Equiano',p:['Olaudah Equiano was kidnapped as a child and enslaved. He later won his freedom and wrote an autobiography describing the stench, crowding, beatings and being forced to eat.','Captives were forced to eat to keep them alive so they could be sold for profit. His account is a key primary source about the trade.']},
  {h:'Resistance & legacy',p:['Enslaved people resisted by keeping their culture alive (music, religion, stories), working slowly, breaking tools, running away and rebelling. One example is the Stono Rebellion in South Carolina (1739).','The trade tore African families apart and took generations of young people. Descendants of enslaved Africans make up a large part of the population of the Americas and have shaped its culture.']},
 ],
 table:{title:'Systems of Labor — Comparison',head:['System','Workers','Choice & length','Status & treatment'],rows:[
  ['Atlantic Slavery','Enslaved Africans','Forced · lifelong · hereditary','Legal property, unpaid, no rights, brutal'],

  ['Encomienda','Native Americans','Coerced forced labor','Not legally owned; promised protection & faith, but severely abused'],
  ['Wage Labor','Hired free workers','Voluntary · open-ended','Paid wages; free to leave']]},

},
{id:'l7',code:'M16 · L7',short:'The Columbian Exchange',title:'The Columbian Exchange & Global Trade',
 years:'1492 – 1700s',color:'#56652A',
 objectives:['Define the Columbian Exchange and name items moving each way.','Explain why corn and potatoes mattered and how disease affected Native Americans.','Define capitalism, joint-stock company, mercantilism, favorable balance of trade and inflation.'],
 sections:[
  {h:'A two-way exchange',p:['The Columbian Exchange was the transfer of plants, animals, foods, people, diseases and knowledge between the Eastern Hemisphere (Europe, Africa, Asia) and the Western Hemisphere (the Americas).','Corn and potatoes were cheap, easy to grow and very nutritious. They improved diets and helped Europe’s population grow.','Horses changed transport and hunting for Plains peoples. Old World diseases (smallpox, measles, influenza, typhus) killed up to 90% of Native Americans.','Negative effects included disease, the growth of the Atlantic slave trade, and environmental damage such as invasive species and cleared forests.']},
  {h:'The Commercial Revolution',p:['Capitalism: an economic system based on private ownership and investing for profit. Merchants invested in exploration hoping for new markets and profits.','Joint-stock company: investors pool money by buying shares and share the risk and the profit. Joint-stock companies funded Jamestown.','Mercantilism: the theory that a nation’s power depends on its wealth (gold and silver). Its main goal was to make the country wealthier and more powerful.','Favorable balance of trade: selling (exporting) more than buying (importing).','Colonies supplied raw materials and also bought the home country’s manufactured goods.','Inflation: a steady rise in prices. In Spain, a flood of American silver and a growing population drove prices up.']},
 ],

 terms:[['Columbian Exchange','Global transfer of plants, animals, foods, diseases, ideas'],['Capitalism','Private ownership & investment for profit'],['Joint-Stock Company','Investors pool money; share risk & profit'],['Mercantilism','Power depends on wealth (gold & silver)'],['Favorable Balance of Trade','Exporting more than importing'],['Inflation','A steady rise in the prices of goods']],
},
{id:'m17',code:'M17 · L1',short:'Spain & Absolutism',title:'Spain’s Empire and European Absolutism',
 years:'1500 – 1650',color:'#A67A1C',
 objectives:['Explain absolutism, divine right and centralization.','Trace Charles V’s empire and Philip II’s reign.','Explain the causes of Spain’s economic decline.','Contrast Spain with the Dutch Republic and the Holy Roman Empire.'],
 sections:[
  {h:'Absolutism',p:['Absolutism: the belief that one ruler should hold all, unlimited power in the state.','Divine Right: the idea that God created the monarchy and the monarch answers only to God.','Centralization: gathering all power and authority in one place or ruler.']},
  {h:'The Habsburgs: Charles V → Philip II',p:['The Habsburg Charles V inherited Spain and also ruled the Holy Roman Empire. The Holy Roman Empire was a decentralized confederation of kingdoms, duchies and city-states under a ceremonial emperor.','When Charles V stepped down in 1556 his empire was split. His brother Ferdinand took the Holy Roman Empire, and his son Philip II took Spain, the Spanish Netherlands and the American colonies.','Philip II took Portugal in 1580, creating a global empire. American mines supplied about 339,000 lbs of gold and 16,000 tons of silver, and the king took a fourth to a fifth of every shipload.','As defender of Catholicism he defeated the Ottoman fleet at Lepanto (1571). His Spanish Armada was defeated by England in 1588. He built the Escorial palace and monastery.','The Habsburgs’ enemies were France, England, the Ottoman Empire and the Protestant Dutch.']},
  {h:'The Golden Age',p:['El Greco painted religious scenes with clashing colors and long, stretched figures. Velázquez painted the royal court (Las Meninas). Cervantes wrote Don Quixote (1605).']},
  {h:'Why Spain declined',p:['Inflation: silver flooded the market while the population grew.','Taxes: nobles paid no taxes, so the burden fell on the poor and no middle class formed.','Around 1500 Spain expelled Jews and Muslims, losing skilled artisans and merchants.','Guilds made Spanish goods expensive, so Spaniards bought from foreign rivals and silver left the country.','Wars were paid for with foreign loans, and Philip II declared bankruptcy three times.']},
  {h:'The Dutch Republic',p:['Philip II raised taxes and tried to crush Protestantism in the Netherlands. In 1579 the seven northern, Protestant provinces declared independence as the United Provinces.','The new country was a republic with religious tolerance, a strong merchant middle class and a global trading empire. Spain, by contrast, was a centralized Catholic empire.']},
 ],
 terms:[['Absolutism','One ruler holds all power'],['Divine Right','Monarch’s power comes from God'],['Centralization','Collecting all power in one place'],['Holy Roman Empire','Confederation under a ceremonial emperor'],['United Provinces','The independent Dutch Republic (Netherlands)'],['Spanish Armada','Philip II’s fleet, defeated by England in 1588'],['El Greco','Painter of Spain’s Golden Age']],
},
];

{id:2,file:'img/ig2.webp',thumb:'img/ig2-t.webp',lessons:['l7'],
 title:'The Columbian Exchange and Global Trade Economics',
 alt:'Infographic showing an infinity loop of crops, livestock and disease crossing the Atlantic, above three panels on mercantilism, capitalism and inflation.',
 steps:[
  {h:'Two hemispheres connected',r:[0,0,100,16],t:'This infographic shows how European colonization linked the Eastern and Western Hemispheres. Crops, animals and diseases crossed the ocean in both directions. At the same time, new economic ideas grew: capitalism and mercantilism.'},
  {h:'From the Americas to the Old World',r:[0,17,50,41],t:'The green and blue side of the loop shows what went from the Americas to Europe, Africa and Asia: corn, potatoes, tomatoes and cacao. Corn and potatoes were cheap, easy to grow and nutritious, so they improved diets and helped populations grow.'},
  {h:'From the Old World to the Americas',r:[50,17,50,41],t:'The orange side shows what came to the Americas: cattle, pigs, horses and grains such as wheat. Smallpox came too. Native Americans had no immunity, and disease killed a huge share of the Indigenous population. This was the most devastating effect of the exchange.'},
  {h:'Mercantilism and a favorable balance of trade',r:[2,62,31,36],t:'Mercantilism is the idea that a nation’s power depends on its wealth, especially gold and silver. Nations used colonies for raw materials and as markets, aiming for a favorable balance of trade: selling, or exporting, more than they bought, or imported.'},
  {h:'Capitalism and joint-stock companies',r:[34,62,33,36],t:'Capitalism is an economic system based on private ownership and investing for profit. In a joint-stock company, many investors pool their money, sharing both the risk and the profit. Joint-stock companies paid for risky ventures such as the Jamestown colony.'},
  {h:'Money supply and inflation',r:[67,62,32,36],t:'Last, inflation: a steady rise in prices. Gold and silver from American mines flooded into Europe, especially Spain. With so much more money around, each coin was worth less, and prices kept climbing.'},
 ]},
];
