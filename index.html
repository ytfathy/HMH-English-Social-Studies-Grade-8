ernán Cortés landed in Mexico in 1519 and conquered the Aztec Empire."}, {"n": 6, "q": "What was the capital city of the Aztec Empire?", "o": ["Cuzco", "Tenochtitlan", "Lima", "Santa Fe"], "part": 1, "a": 1, "x": "Tenochtitlan was the island capital city of the Aztec Empire in central Mexico."}, {"n": 7, "q": "Who was the Aztec emperor when Hernán Cortés arrived in Mexico?", "o": ["Atahualpa", "Montezuma II", "Popé", "Metacom"], "part": 1, "a": 1, "x": "Montezuma II was the Aztec emperor who met Cortés in 1519."}, {"n": 8, "q": "Why did Aztec Emperor Montezuma II initially offer gold to Hernán Cortés?", "o": ["He believed Cortés might be an armor-wearing god or supernatural figure and wanted to appease him", "He was purchasing Spanish weapons to use against neighboring tribes", "He was paying taxes owed under the encomienda system", "He wanted to hire Spanish mercenaries to defend Tenochtitlan"], "part": 1, "a": 0, "x": "Montezuma II believed Cortés might be an armor-wearing god or supernatural figure and offered gold as ransom/persuasion."}, {"n": 9, "q": "Which factor significantly aided Cortés in defeating the Aztec Empire despite being vastly outnumbered?", "o": ["Superior Spanish numbers and native knowledge of local terrain", "Alliances with native groups who opposed Aztec rule, advanced steel weapons, horses, and European disease outbreaks", "Help from French naval forces operating in the Gulf of Mexico", "Peaceful negotiations and treaties signed by Montezuma II"], "part": 1, "a": 1, "x": "Cortés won through native alliances against Aztec rule, superior steel/horse technology, and smallpox epidemics."}, {"n": 10, "q": "Which Spanish conquistador entered South America in 1532 and conquered the Incan Empire?", "o": ["Francisco Pizarro", "Hernán Cortés", "Samuel de Champlain", "Giovanni da Verrazzano"], "part": 1, "a": 0, "x": "Francisco Pizarro entered South America in 1532 and conquered the Incan Empire."}, {"n": 11, "q": "Who was the last Incan emperor captured by Francisco Pizarro at Cajamarca?", "o": ["Montezuma II", "Atahualpa", "Popé", "Powhatan"], "part": 1, "a": 1, "x": "Atahualpa was the last Incan emperor captured by Pizarro at Cajamarca."}, {"n": 12, "q": "What ransom did Atahualpa offer Pizarro in exchange for his release?", "o": ["Control of all Incan silver mines in Potosí", "A room filled once with gold and twice with silver", "Conversion of all Incas to Catholicism", "Safe passage for Spanish troops to return to Spain"], "part": 1, "a": 1, "x": "Atahualpa offered a room filled once with gold and twice with silver as his ransom."}, {"n": 13, "q": "What happened to Incan ruler Atahualpa after he paid the promised gold and silver ransom?", "o": ["He was safely returned to his capital at Cuzco", "He was executed by Spanish forces after converting to Christianity", "He escaped into the Andes Mountains and led a guerilla war", "He traveled to Spain to appeal to King Charles V"], "part": 1, "a": 1, "x": "Despite receiving the ransom, Spanish forces executed Atahualpa by strangulation after converting him."}, {"n": 14, "q": "Which city was founded by Francisco Pizarro in 1535 as the new Spanish capital of Peru?", "o": ["Cuzco", "Lima", "Santa Fe", "Veracruz"], "part": 1, "a": 1, "x": "Pizarro founded Lima in 1535 as the new Spanish capital of Peru."}, {"n": 15, "q": "What was the Spanish encomienda system?", "o": ["A free-market wage system for European immigrants", "A grant by the Spanish Crown giving colonists the right to force Native Americans to labor on plantations and in mines", "A religious treaty dividing the Americas between Spain and Portugal", "A trade agreement between English colonists and Native Americans"], "part": 1, "a": 1, "x": "The encomienda system granted Spanish landlords forced Native American labor on plantations and in mines."}, {"n": 16, "q": "What term described social class descendants of mixed Spanish and Native American ancestry?", "o": ["Peninsulares", "Creoles", "Mestizos", "Bandeirantes"], "part": 1, "a": 2, "x": "Mestizos were people of mixed Spanish and Native American ancestry."}, {"n": 17, "q": "Who was Bartolomé de Las Casas?", "o": ["A Spanish conquistador who conquered Florida", "A Dominican priest who criticized the brutal mistreatment and forced labor of Native Americans under encomienda", "A French explorer who established Quebec", "A Dutch governor of New Netherland"], "part": 1, "a": 1, "x": "Bartolomé de Las Casas was a Catholic Dominican priest who condemned Spanish encomienda abuses."}, {"n": 18, "q": "What action did the Spanish government take regarding the encomienda system in 1542?", "o": ["Expanded it to all European colonies in North America", "Abolished the encomienda system following widespread criticism", "Made encomienda holdings hereditary forever", "Replaced encomienda with French fur-trading charters"], "part": 1, "a": 1, "x": "The Spanish Crown officially abolished the encomienda system in 1542 following Las Casas's advocacy."}, {"n": 19, "q": "Who led the successful Pueblo Revolt against Spanish colonial rule in New Mexico in 1680?", "o": ["Montezuma II", "Popé", "Metacom", "Powhatan"], "part": 1, "a": 1, "x": "Popé was a Pueblo religious leader who led the successful 1680 Pueblo Revolt."}, {"n": 20, "q": "What was the immediate outcome of the 1680 Pueblo Revolt in New Mexico?", "o": ["Pueblo forces pushed the Spanish out of Santa Fe and controlled the region for 12 years", "Spanish forces immediately crushed the revolt and executed all leaders", "The Pueblo people adopted Catholicism and joined the Spanish army", "New Mexico was sold to the French Empire"], "part": 1, "a": 0, "x": "The Pueblo Revolt drove Spanish colonists out of Santa Fe, allowing Pueblo control for 12 years (1680–1692)."}, {"n": 21, "q": "What were Portuguese 'bandeiras' in colonial Brazil?", "o": ["Royal sugar plantations in coastal cities", "Slave-hunting expeditions that raided the interior to capture Indigenous people for forced labor", hamplain", "Jacques Cartier", "René-Robert Cavelier", "Sieur de La Salle"], "part": 1, "a": 1, "x": "Jacques Cartier explored the St. Lawrence River in 1534 and named Mont Real (Montreal)."}, {"n": 27, "q": "Who established Quebec in 1608 as the base of France's colonial empire in North America (New France)?", "o": ["Jacques Cartier", "Samuel de Champlain", "Giovanni da Verrazzano", "Henry Hudson"], "part": 1, "a": 1, "x": "Samuel de Champlain founded Quebec in 1608 as the base of New France."}, {"n": 28, "q": "What was the primary economic activity of French colonists in New France?", "o": ["Gold and silver mining", "Large-scale tobacco farming", "The fur trade with Native American partners", "Sugar plantation agriculture"], "part": 1, "a": 2, "x": "The fur trade with Native American partners was New France's main economic activity."}, {"n": 29, "q": "Which permanent English colony was founded in Virginia in 1607?", "o": ["Plymouth", "Jamestown", "Massachusetts Bay", "New Amsterdam"], "part": 1, "a": 1, "x": "Jamestown was founded in Virginia in 1607 as the first permanent English colony."}, {"n": 30, "q": "Which profitable cash crop saved the Jamestown colony financially?", "o": ["Sugar", "Tobacco", "Cotton", "Rice"], "part": 1, "a": 1, "x": "Tobacco became Jamestown's profitable cash crop export."}, {"n": 31, "q": "What conflict broke out in New England in 1675 between Native Americans led by Metacom and English colonists?", "o": ["The French and Indian War", "King Philip's War", "The Pueblo Revolt", "The Stono Rebellion"], "part": 1, "a": 1, "x": "King Philip's War (1675) was fought between New England colonists and Native Americans led by Metacom."}, {"n": 32, "q": "What dispute triggered the outbreak of the French and Indian War in 1754?", "o": ["Disagreements over sugar trade in the Caribbean", "Overlapping British and French land claims in the Ohio River Valley", "Dutch attacks on English shipping in New York", "Spanish attempts to claim Florida SYSTEMS"], "part": 1, "a": 1, "x": "The French and Indian War (1754–1763) began over conflicting land claims in the Ohio River Valley."}, {"n": 33, "q": "Why did European colonists increasingly turn to enslaved Africans for labor in the Americas?", "o": ["Native American populations suffered catastrophic deaths from European diseases, warfare, and forced labor", "African workers demanded lower wages than European indentured servants", "European monarchs passed laws forbidding European settlement in America", "Native Americans refused to work on farms under any circumstances"], "part": 2, "a": 0, "x": "European disease epidemics killed millions of Native Americans, leading colonists to import African workers."}, {"n": 34, "q": "Which two European nations were involved first and brought the most enslaved Africans in early stages?", "o": ["England and France", "Spain and Portugal", "Netherlands and Sweden", "Germany and Italy"], "part": 2, "a": 1, "x": "Spain and Portugal led early African slave trade imports (Portugal to Brazil sugar plantations)."}, {"n": 35, "q": "Which European nation became the dominant slave-trading power in the 18th century (1690–1807)?", "o": ["Spain", "Portugal", "England (Britain)", "France"], "part": 2, "a": 2, "x": "England (Britain) became the leading slave-trading country in the 18th century (1690–1807)."}, {"n": 36, "q": "What was the Triangular Trade?", "o": ["A direct route between Spain and Peru for silver transport", "A 3-leg transatlantic trading network linking Europe, Africa, and the Americas", "A trade agreement between Native Americans, French, and Dutch fur traders", "An overland trade route connecting West Africa to North Africa"], "part": 2, "a": 1, "x": "The Triangular Trade was a 3-leg transatlantic network connecting Europe, Africa, and the Americas."}, {"n": 37, "q": "In the Triangular Trade network, what was carried from Europe to West Africa?", "o": ["Sugar, coffee, and tobacco", "Manufactured goods, cloth, guns, and rum", "Enslaved Africans and gold", "Raw cotton and timber"], "part": 2, "a": 1, "x": "Manufactured goods, cloth, guns, and rum were exported from Europe to West Africa."}, {"n": 38, "q": "In the Triangular Trade, what was carried from the Americas to Europe on the final leg?", "o": ["Manufactured weapons and textiles", "Agricultural cash crops such as sugar, tobacco, coffee, and molasses", "Captured enslaved workers", "European indentured servants"], "part": 2, "a": 1, "x": "Cash crops (sugar, tobacco, coffee, molasses) were shipped from American plantations to Europe."}, {"n": 39, "q": "What was the 'Middle Passage'?", "o": ["The sea route connecting England to Asia around Africa", "The forced ocean voyage that transported enslaved Africans across the Atlantic to the Americas", "The land trek across the Sahara Desert", "The trade route connecting New England to the West Indies"], "part": 2, "a": 1, "x": "The Middle Passage was the forced ocean voyage transporting captured Africans across the Atlantic."}, {"n": 40, "q": "According to textbook estimates, approximately what percentage of enslaved Africans died during the Middle Passage?", "o": ["5%", "20%", "50%", "75%"], "part": 2, "a": 1, "x": "Textbook estimates indicate roughly 20% of enslaved Africans died during the Middle Passage voyage."}, {"n": 41, "q": "Who was Olaudah Equiano?", "o": ["An African monarch who prohibited the slave trade in his kingdom", "A formerly enslaved African who wrote an autobiography describing the brutal conditions of the Middle Passage", "A leader of the Pueblo Revolt in New Mexico", "A Spanish priest who advocated for encomienda expansion"], "part": 2, "a": 1, "x": "Olaudah Equiano wrote a famous primary-source autobiography detailing Middle Passage horrors."}, {"n": 42, "q": "How did Olaudah Equiano describe conditions below deck on the slave ship during the Middle Passage?", "o": ["Spacious, clean, and well-ventilated", "Suffocating stench, extreme overcrowding, intense heat, sickness, and beatings", "Comfortable with regular medical care provided by ship officers", "Quiet and organized with private sleeping quarters"], "part": 2, "a": 1, "x": "Equiano described suffocation, extreme filth, heat, disease, and brutal floggings below deck."}, {"n": 43, "q": "Why did ship officers force enslaved people like Equiano to eat during the voyage?", "o": ["Out of compassion and concern for human welfare", "To maintain captives' physical health so they could be sold for profit in the Americas", "To satisfy royal navy regulations regarding passenger care", "Because captives requested extra meals"], "part": 2, "a": 1, "x": "Captives were force-fed to keep them alive so they could be sold for profit upon arrival."}, {"n": 44, "q": "What major uprising by enslaved Africans occurred in South Carolina in 1739?", "o": ["The Pueblo Revolt", "The Stono Rebellion", "Bacon's Rebellion", "King Philip's War"], "part": 2, "a": 1, "x": "The Stono Rebellion was a major 1739 uprising by enslaved Africans in South Carolina."}, {"n": 45, "q": "How did enslaved Africans actively resist the brutal conditions of slavery?", "o": ["Preserving ancestral cultural traditions, music, and stories", "Working slowly, breaking tools, uprooting plants, escaping, and rebelling", "Petitioning European monarchs directly for legal representation", "Both A and B"], "part": 2, "a": 3, "x": "Enslaved Africans resisted through cultural preservation, work slowdowns, tool breaking, escape, and rebellion."}, {"n": 46, "q": "How did indentured servitude differ fundamental from Atlantic slavery?", "o": ["Indentured servitude was lifelong and hereditary", "Indentured servants contracted voluntarily for a set number of years (4–7 years) to pay passage; slavery was forced, lifelong, and hereditary", "Indentured servants were treated as legal property and sold at auctions", "Indentured servitude was applied exclusively to Native Americans"], "part": 2, "a": 1, "x": "Indentured servants worked a set term (4–7 years) for passage; slavery was forced, lifelong, and hereditary."}, {"n": 47, "q": "How did the encomienda system differ from Atlantic chattel slavery?", "o": ["Encomienda workers received monetary wages for their labor", "Native Americans under encomienda were technically not owned as legal property, though subject to severe forced labor and abuse", "Encomienda was voluntary and lasted for 3 years", "Encomienda was established exclusively in English North America"], "part": 2, "a": 1, "x": "Native Americans under encomienda were technically not owned as legal property, unlike chattel slavery."}, {"n": 48, "q": "What was a major long-term demographic and cultural consequence of the Atlantic slave trade in the Americas?", "o": ["Complete loss of African agricultural techniques in the New World", "Descendants of enslaved Africans formed a substantial population in the Americas and profoundly shaped culture, food, art, music, and society", "Total economic decline of all European home countries", "Re-establishment of native Incan rule in South America"], "part": 2, "a": 1, "x": "Descendants of enslaved Africans formed substantial populations that deeply shaped American culture and society."}, {"n": 49, "q": "According to textbook estimates, roughly how many Africans had been imported to the Americas by 1870?", "o": ["1 million", "400,000", "9.5 million", "20 million"], "part": 2, "a": 2, "x": "Textbook estimates show about 9.5 million Africans were imported to the Americas by 1870."}, {"n": 50, "q": "How did the Atlantic slave trade affect kingdoms and societies in West Africa?", "o": ["It brought long-term peace and political stability across the continent", "It tore families apart, deprived communities of generations of young leaders, and introduced firearms that altered political power", "It ended all internal trade routes within Africa", "It led to immediate industrialization in West Africa ECONOMICS"], "part": 2, "a": 1, "x": "The trade devastated African communities, broke apart families, and introduced firearms that disrupted power."}, {"n": 51, "q": "What was the Columbian Exchange?", "o": ["A formal peace treaty between Spain and Portugal signed in 1494", "The global transfer of plants, animals, foods, human populations, diseases, and knowledge between Eastern and Western Hemispheres", "A slave-trading route linking West Africa directly to New England", "A stock exchange established in Amsterdam"], "part": 3, "a": 1, "x": "The Columbian Exchange was the global transfer of plants, animals, foods, diseases, and knowledge between hemispheres."}, {"n": 52, "q": "Which vital food crops originated in the Americas and traveled to Europe, Asia, and Africa?", "o": ["Wheat, barley, oats, and rice", "Corn (maize) and potatoes", "Sugar cane and coffee beans", "Olives and citrus fruits"], "part": 3, "a": 1, "x": "Corn (maize) and potatoes originated in the Americas and spread globally."}, {"n": 53, "q": "Why were corn and potatoes particularly important to European and global populations?", "o": ["They required expensive machinery to cultivate", "They were inexpensive to grow, highly nutritious, improved diets, and supported population growth", "They were used exclusively as horse feed", "They were imported only by wealthy royal courts"], "part": 3, "a": 1, "x": "Corn and potatoes were cheap to grow and highly nutritious, boosting European diets and population growth."}, {"n": 54, "q": "Which animal introduced from Europe drastically changed transportation, hunting, and life for Indigenous peoples on the American Great Plains?", "o": ["The turkey", "The horse", "The llama", "The bison"], "part": 3, "a": 1, "x": "European horses transformed transportation, hunting, and warfare for Plains Indigenous nations."}, {"n": 55, "q": "Which livestock animals traveled from the Old World (Europe/Africa/Asia) to the Americas?", "o": ["Turkeys and guinea pigs", "Horses, cattle, pigs, and sheep", "Llamas and alpacas", "Iguanas and rattlesnakes"], "part": 3, "a": 1, "x": "Horses, cattle, pigs, and sheep were brought from the Old World to the Americas."}, {"n": 56, "q": "Which European-introduced disease caused devastating mortality rates among Native Americans who lacked biological immunity?", "o": ["Smallpox", "Yellow fever", "Malaria", "Scurvy"], "part": 3, "a": 0, "x": "Smallpox was the most devastating European disease introduced to immune-deficient Native populations."}, {"n": 57, "q": "What was an economic system based on private ownership and the investment of resources for profit?", "o": ["Mercantilism", "Capitalism", "Encomienda", "Feudalism"], "part": 3, "a": 1, "x": "Capitalism is an economic system based on private ownership and investment for profit."}, {"n": 58, "q": "What is a joint-stock company?", "o": ["A business owned entirely by a absolute monarch", "A partnership where multiple investors pool capital by buying shares, sharing both high costs/risks and potential profits", "A government agency that regulates slave ship dimensions", "A guild that controls price limits in local markets"], "part": 3, "a": 1, "x": "Joint-stock companies pooled investor money to share high costs, risks, and potential profits."}, {"n": 59, "q": "What was the primary purpose of joint-stock companies in early 17th-century colonization?", "o": ["Financing expensive and risky overseas colonial ventures like Jamestown", "Ending international trade competition between European nations", "Purchasing land from Native American tribes peacefully", "Providing free passage to European peasants"], "part": 3, "a": 0, "x": "Joint-stock companies financed expensive, high-risk colonial ventures like Jamestown."}, {"n": 60, "q": "What was the economic theory of mercantilism prominent in Europe from the 16th to 18th centuries?", "o": ["A nation's power depended primarily on its wealth (gold and silver reserves)", "Free trade should exist without government tariffs or intervention", "All colonies should become independent economic entities", "Agriculture was the only true source of national wealth"], "part": 3, "a": 0, "x": "Mercantilism held that national power depended on wealth, especially accumulating gold and silver."}, {"n": 61, "q": "How did a nation achieve a 'favorable balance of trade' under mercantilist policy?", "o": ["Importing more goods from foreign rivals than it exported", "Selling (exporting) more goods to other countries than it bought (imported)", "Abolishing all merchant profits and corporate taxes", "Banning all overseas merchant shipping"], "part": 3, "a": 1, "x": "A favorable balance of trade meant exporting (selling) more value in goods than importing (buying)."}, {"n": 62, "q": "Under mercantilism, what double role did colonies play for the home country?", "o": ["Independent competitors and military equals", "Suppliers of raw materials/precious metals AND exclusive markets for manufactured goods", "Tax collectors and religious courts", "Banking centers and currency printers"], "part": 3, "a": 1, "x": "Colonies supplied raw materials/precious metals and served as exclusive markets for finished goods."}, {"n": 63, "q": "What is inflation?", "o": ["A rapid drop in the market price of luxury items", "A steady rise in the prices of goods accompanied by a decline in the purchasing value of money", "An increase in the gold content of minted coins", "A government decree capping food prices"], "part": 3, "a": 1, "x": "Inflation is a steady rise in prices accompanied by a fall in purchasing power."}, {"n": 64, "q": "What caused severe inflation in Spain during the 16th and 17th centuries?", "o": ["A complete shortage of silver coins in Spanish banks", "Growing population increasing demand alongside a massive influx of gold and silver from American mines flooding the market", "High taxes imposed by English merchants", "The abolition of Spanish merchant guilds"], "part": 3, "a": 1, "x": "Spanish silver flooding the market combined with population growth drove severe 16th–17th century ods", "It increased their regional political power (why they took part)"]}, {"n": 38, "q": "Who was Olaudah Equiano? Summarize his experiences during the Middle Passage and his historical legacy.", "o": [], "unit": 2, "t": "essay", "model": "Equiano bought his freedom in 1766 and published his 1789 autobiography, fueling the British abolitionist movement.", "points": ["Enslaved African taken on the Middle Passage", "Described its horrors (crowding, stench, beatings, forced eating)", "Bought his freedom (1766) and published his autobiography (1789)", "Legacy: fueled the British abolitionist movement"]}, {"n": 39, "q": "Primary Source Analysis (Equiano's Narrative): 1) Why did slave ship crew force captives to eat? 2) What did ship diagrams reveal about conditions?", "o": [], "unit": 2, "t": "essay", "model": "1) Crew force-fed captives to prevent suicide and protect profits. 2) Ship diagrams showed inhumanly tight packing.", "points": ["1) Crew force-fed captives to prevent suicide", "…and to protect profits (keep them alive to sell)", "2) Diagrams showed inhumanly tight packing / overcrowding"]}, {"n": 40, "q": "Compare Indentured Servitude with the Atlantic Slave Trade. What were the key differences regarding freedom, duration, and legal status?", "o": [], "unit": 2, "t": "essay", "model": "Servitude was temporary and contractual; slavery was permanent, inherited, racialized, and treated humans as property.", "points": ["Indentured servitude: temporary, voluntary contract", "Slavery: permanent and inherited (hereditary)", "Slavery was racialized and treated humans as property"]}, {"n": 41, "q": "Why does the history of the Atlantic Slave Trade remain highly significant today in terms of demographics, culture, and economy?", "o": [], "unit": 2, "t": "essay", "model": "It reshaped global demographics, enriched Western nations, and left enduring cultural legacies across the Americas.", "points": ["Reshaped demographics of the Americas", "Enriched Western nations’ economies", "Left lasting cultural legacies across the Americas"]}, {"n": 42, "q": "Match the labor / trade term with its historical definition:", "o": [], "unit": 2, "x": "1-Middle Passage (Brutal voyage); 2-Triangular Trade (3-part network); 3-Indentured Servitude (Work contract); 4-Encomienda (Native labor grant).", "t": "match", "pairs": [["Middle Passage", "Brutal transatlantic voyage carrying enslaved captives"], ["Triangular Trade", "Three-part trade network exchanging goods, slaves, & crops"], ["Indentured Servitude", "Work contract for set years in exchange for ocean passage"], ["Encomienda", "Forced Indigenous labor grant to Spanish landlords"]], "extra": []}, {"n": 43, "q": "Which statement best defines the Columbian Exchange?", "o": ["The transfer of gold exclusively from the Americas to Europe", "The global transfer of plants, animals, foods, human populations, and diseases following Columbus's voyages", "A political alliance formed between Spain and Portugal", "The trade of manufactured goods between European nations"], "unit": 3, "x": "The Columbian Exchange was the widespread transfer of organisms, foods, and diseases between Hemispheres.", "a": 1, "t": "mc"}, {"n": 44, "q": "Which of the following animals was introduced TO the Americas FROM Europe?", "o": ["Turkey", "Horse", "Llama", "Alpaca"], "unit": 3, "x": "Horses were brought by Spanish conquistadors and transformed Native American plains cultures.", "a": 1, "t": "mc"}, {"n": 45, "q": "Which essential food crop originated IN the Americas and was introduced TO Europe?", "o": ["Wheat", "Barley", "Potato", "Rice"], "unit": 3, "x": "Potatoes originated in the Andes and became a staple crop sustaining European population growth.", "a": 2, "t": "mc"}, {"n": 46, "q": "Which item was NOT transferred across oceans as a result of the Columbian Exchange?", "o": ["Agricultural crops", "Infectious diseases", "Continental land masses", "Livestock"], "unit": 3, "x": "Continental land masses did not move; living species and human populations crossed the oceans.", "a": 2, "t": "mc"}, {"n": 47, "q": "Which of these agricultural products was native to the Old World (Europe/Asia) and brought to America?", "o": ["Corn (Maize)", "Tomatoes", "Mushrooms", "Wheat"], "unit": 3, "x": "Wheat, barley, rice, and sugarcane were Old World crops brought to the Americas.", "a": 3, "t": "mc"}, {"n": 48, "q": "Why were American crops like corn and potatoes so vital to European population growth?", "o": ["They were rare luxuries reserved for royalty", "They were inexpensive, easy to cultivate, and highly nutritious", "They were used exclusively as medicinal cures", "They could only grow in tropical greenhouse environments"], "unit": 3, "x": "Corn and potatoes yielded more calories per acre than Old World grains, boosting European nutrition.", "a": 1, "t": "mc"}, {"n": 49, "q": "What was the most devastating negative consequence of the Columbian Exchange for Native Americans?", "o": ["Loss of European trade items", "Exposure to Old World diseases (smallpox, measles) to which they had no immunity", "Rapid growth of European cities", "Introduction of new livestock"], "unit": 3, "x": "Old World pathogens (smallpox, measles, flu) wiped out 80-90% of Indigenous populations lacking immunity.", "a": 1, "t": "mc"}, {"n": 50, "q": "What is Capitalism?", "o": ["An economic system based on state-owned monopolies and command control", "An economic system based on private ownership and investment of wealth for profit", "A system prohibiting international commerce", "Feudal landlordism"], "unit": 3, "x": "Capitalism is an economic system based on private ownership, open competition, and profit investment.", "a": 1, "t": "mc"}, {"n": 51, "q": "Why did European merchants invest capital in overseas exploration and colonization?", "o": ["To discover new trade routes, access foreign markets, and generate substantial profits", "To reduce government revenues", "To capture European peasants for forced labor", "To establish democratic republics abroad"], "unit": 3, "x": "Commercial Revolution merchants sought high profit returns from colonial trade goods like sugar and spices.", "a": 0, "t": "mc"}, {"n": 52, "q": "What is a Joint-Stock Company?", "o": ["A business entity owned entirely by a monarch", "A business partnership where investors pool money to fund enterprise and share risks/profits", "A state-funded charity for sailors", "A guild of agricultural workers"], "unit": 3, "x": "Joint-stock companies allowed investors to buy shares, pooling capital and spreading high maritime risks.", "a": 1, "t": "mc"}, {"n": 53, "q": "According to the economic theory of Mercantilism, what determined a nation's power?", "o": ["The physical size of its land area", "Its total accumulated wealth in gold and silver", "The size of its civilian democratic electorate", "Its agricultural diversity alone"], "unit": 3, "x": "Mercantilism held that global wealth was finite and measured strictly by gold/silver bullion reserves.", "a": 1, "t": "mc"}, {"n": 54, "q": "How did a country achieve a favorable Balance of Trade under Mercantilism?", "o": ["By importing more goods than it exported", "By exporting (selling) a greater value of goods than it imported (bought)", "By eliminating all tariff barriers", "By maintaining equal exchange rates with all rivals"], "unit": 3, "x": "Favorable balance of trade: selling more total exports than buying imports to create a net bullion inflow.", "a": 1, "t": "mc"}, {"n": 55, "q": "What key economic role did colonies play for mother countries under Mercantilism?", "o": ["They supplied cheap raw materials and served as captive markets for manufactured exports", "They competed directly against home country industries", "They operated as independent financial centers", "They provided elected officials to European parliaments"], "unit": 3, "x": "Colonies provided cheap raw materials to the mother country and purchased its finished manufactured products.", "a": 0, "t": "mc"}, {"n": 56, "q": "Who ruled the Holy Roman Empire before abdicating and splitting the Habsburg realm in 1556?", "o": ["Philip II", "Ferdinand I", "Charles V", "Louis XIV"], "unit": 4, "x": "Habsburg Emperor Charles V ruled Spain and HRE before abdicating in 1556 due to constant warfare.", "a": 2, "t": "mc"}, {"n": 57, "q": "How was Charles V's vast empire divided upon his retirement?", "o": ["It completely collapsed into independent republics", "His brother Ferdinand received Austria & HRE; his son Philip II inherited Spain, Spanish Netherlands, & American colonies", "France conquered the entire Habsburg territory", "The Pope assumed direct administration of all lands"], "unit": 4, "x": "Ferdinand I received Austria/HRE; Philip II received Spain, Netherlands, Milan, Naples, and the Americas.", "a": 1, "t": "mc"}, {"n": 58, "q": "Which famous Spanish Renaissance painter reflected intense Catholic faith in his artwork during the Spanish Golden Age?", "o": ["Leonardo da Vinci", "El Greco", "Rembrandt", "Diego Velázquez"], "unit": 4, "x": "El Greco (Doménikos Theotokópoulos) painted dramatic religious scenes expressing Spanish Counter-Reformation zeal.", "a": 1, "t": "mc"}, {"n": 59, "q": "Which factor was NOT a major cause of Spain's economic decline in the 17th century?", "o": ["Severe inflation caused by silver influx and population growth", "Expulsion of skilled Jewish and Muslim merchants and artisans", "Heavy taxation on the lower classes and costly foreign wars", "Lower classes adopting Protestantism and refusing to pay taxes"], "unit": 4, "x": "The Spanish lower classes were Catholic; heavy taxation on peasants and expulsions of minorities harmed economy.", "a": 3, "t": "mc"}, {"n": 60, "q": "What is economic inflation?", "o": ["A decline in government spending", "A steady rise in the general price of goods coupled with a drop in the purchasing power of money", "A system of high protective tariffs", "An increase in agricultural output"], "unit": 4, "x": "Inflation occurred as massive silver imports degraded money value while growing population raised demand.", "a": 1, "t": "mc"}, {"n": 61, "q": "What political concept describes concentrating all governmental power and authority into a single central ruler or government?", "o": ["Centralization", "Regionalism", "Federalism", "Feudalism"], "unit": 4, "x": "Centralization concentrates executive, legislative, and judicial power into a single central state authority.", "a": 0, "t": "mc"}, {"n": 62, "q": "What is Absolutism in early modern European governance?", "o": ["Rule by an elected parliament", "A system where a monarch holds supreme, unrestricted power over state and subjects", "A decentralized alliance of city-states", "Governance by merchant guilds"], "unit": 4, "x": "Absolutism asserts that monarchs hold divine right and unchecked political power over all state affairs.", "a": 1, "t": "mc"}, {"n": 63, "q": "Which leader would NOT be classified as an absolute ruler in historical political science?", "o": ["King Louis XIV of France", "Sultan Suleiman the Magnificent", "President Barack Obama", "Tsar Peter the Great"], "unit": 4, "x": "President Barack Obama governed under a constitutional democracy with separation of powers, not absolutism.", "a": 2, "t": "mc"}, {"n": 64, "q": "Which nation successfully revolted against Spanish Catholic rule in the 16th century to win independence?", "o": ["Portugal", "Austria", "The Netherlands (United Provinces)", "Switzerland"], "unit": 4, "x": "The 7 northern Protestant provinces declared independence as the Dutch Republic (United Provinces) in 1581.", "a": 2, "t": "mc"}, {"n": 65, "q": "Which state was NOT considered an enemy of the Catholic Habsburg dynasty during the 16th/17th centuries?", "o": ["Ottoman Empire", "Holy Roman Empire", "France", "England"], "unit": 4, "x": "The Holy Roman Empire was ruled by the Habsburgs themselves (Ferdinand I line), not an external enemy.", "a": 1, "t": "mc"}];

function runSet(set){
 if(cleanup){cleanup();cleanup=null}
 ttsStop();
 const exam=!!set.exam;
 const items=set.qs.map(q=>{let order=null;if(q.t==='mc'){order=(set.group==='ws'||set.group==='fg'||q.keep)?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i))}

 const kh=e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;const k=e.key;
  if(/^[1-8]$/.test(k)){const o=$$('.opts .opt:not(:disabled)',v)[+k-1];o&&o.click()}
  if(k==='Enter'){const b=$('[data-primary]:not(:disabled)',v);b&&b.click()}};

 cleanup=()=>{clearInterval(tick);document.removeEventListener('keydown',kh)};
 $('[data-quit]',v).onclick=()=>{const answered=items.some(it=>it.score!=null||it.resp!=null);const leave=()=>{cleanup();cleanup=null;route()};answered?confirmBox('Leave this set?','Answers you have already checked stay in your report, but this attempt will not be scored.','Leave',leave):leave()};
 const segs=$$('.segs i',v);
 function paintSegs(){segs.forEach((s,i)=>{const it=items[i];s.className='';if(i===idx)s.classList.add('cur');else if(exam&&it.resp!=null)s.classList.add('ans');else if(it.score!=null)s.classList.add(it.score>=.999?'ok':it.score<=0?'no':'part')})}
 function show(){paintSegs();const it=items[idx],q=it.q,box=$('[data-q]',v);box.innerHTML='';
  const L=lessonOf(q.lesson);
  const card=h(`<div class="qcard"><div class="qnum"><span>Question ${idx+1} of ${items.length}</span><span style="color:${L.color}">${esc(L.short||'')}</span></div><div class="qtext">${esc(q.q)}</div><div data-body></div><div data-fb aria-live="assertive"></div>

  box.appendChild(card);
  const bodyEl=$('[data-body]',card),fb=$('[data-fb]',card),primary=$('[data-primary]',card),hint=$('[data-hint]',card);
  $('[data-prev]',card).onclick=()=>{idx--;show()};
  const done=it.score!=null&&!exam;
  const next=()=>{if(idx<items.length-1){idx++;show()}else finish()};
  const setNext=()=>{primary.textContent=idx<items.length-1?'Next →':'See results';primary.disabled=false;primary.onclick=next};
  const showFb=(ok,extra,neutral)=>{fb.innerHTML=`<div class="fb ${neutral?'neutral':ok?'ok':'no'}"><b>${neutral?'Self-check complete':ok?'Correct!':'Not quite.'}</b>${extra||''}</div>`};

  if(q.t==='mc'||q.t==='tf'){
   const opts=q.t==='tf'?[['True',true],['False',false]]:it.order.map(i=>[q.o[i],i]);
   const correctVal=q.t==='tf'?q.a:q.a;
   bodyEl.innerHTML=`<div class="opts" role="radiogroup">${opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="false" data-v="${i}"><span class="l">${LET[i]}</span><span>${esc(o[0])}</span></button>`).join('')}</div>`;

   btns.forEach((b,i)=>b.onclick=()=>pick(i));
   if(sel!=null){btns[sel].classList.add('sel');if(exam)setNext()}
   if(done){lock();showFb(it.score===1,q.x?esc(q.x):'');setNext()}
   else if(!exam)primary.onclick=()=>{if(sel==null)return;it.resp=sel;it.score=opts[sel][1]===correctVal?1:0;recordQ(q,it.score);save();lock();
    const right=opts.find(o=>o[1]===correctVal)[0];showFb(it.score===1,(it.score?'':`The answer is <b style="display:inline">${esc(right)}</b>. `)+(q.x?esc(q.x):''));paintSegs();setNext()};
  }
  else if(q.t==='fill'){
   bodyEl.innerHTML=`<label class="sr" for="fillin">Your answer</label><input id="fillin" class="fill" autocomplete="off" placeholder="Type your answer…" value="${esc(it.resp||'')}">`;
   const inp=$('input',bodyEl);hint.textContent='Press Enter to check';
   const grade=val=>{const n=norm(val);return q.accept.some(a=>n.includes(norm(a)))?1:0};
   inp.oninput=()=>{primary.disabled=!inp.value.trim();if(exam){it.resp=inp.value;it.score=grade(inp.value);if(inp.value.trim())setNext()}};

   if(it.resp&&exam)setNext();
   if(done){inp.disabled=true;showFb(it.score===1,'Accepted answer: '+esc(q.ans)+'. '+esc(q.x||''));setNext()}
   else if(!exam){primary.onclick=()=>{it.resp=inp.value;it.score=grade(inp.value);recordQ(q,it.score);save();inp.disabled=true;showFb(it.score===1,'Accepted answer: '+esc(q.ans)+'. '+esc(q.x||''));paintSegs();setNext()}}

  }
  else if(q.t==='match'){

   const paint=()=>{$$('[data-l]',bodyEl).forEach(b=>{const i=+b.dataset.l;b.classList.toggle('act',act===i);const p=map[i]!=null;b.classList.toggle('paired',p);const tg=$('.tag',b);tg.style.background=p?cols[i%8]:'';});
    $$('[data-r]',bodyEl).forEach(b=>{const j=+b.dataset.r;const li=Object.keys(map).find(k=>map[k]===j);const tg=$('.tag',b);b.classList.toggle('paired',li!=null);tg.textContent=li!=null?(+li+1):'·';tg.style.background=li!=null?cols[li%8]:'';tg.style.color=li!=null?'#fff':''});
    const full=Object.keys(map).length===lefts.length;if(exam){it.resp={...map};it.score=gradeM();if(full)setNext();else{primary.disabled=true}}else primary.disabled=!full};
   const gradeM=()=>{let c=0;lefts.forEach((_,i)=>{if(map[i]!=null&&rights[map[i]]===q.pairs[i][1])c++});return c/lefts.length};
   bodyEl.onclick=e=>{if(done||(it.score!=null&&!exam))return;const L=e.target.closest('[data-l]'),R=e.target.closest('[data-r]');
    if(L){act=+L.dataset.l;if(map[act]!=null){delete map[act]}paint()}
    if(R&&act!=null){const j=+R.dataset.r;for(const k in map)if(map[k]===j)delete map[k];map[act]=j;const nx=lefts.findIndex((_,i)=>map[i]==null);act=nx<0?null:nx;paint()}};
   const reveal=()=>{$$('.mi',bodyEl).forEach(b=>b.disabled=true);$$('[data-l]',bodyEl).forEach(b=>{const i=+b.dataset.l;b.classList.add(rights[map[i]]===q.pairs[i][1]?'right':'wrong')});
    showFb(it.score>=.999,`${Math.round(it.score*lefts.length)} of ${lefts.length} pairs correct.<br>${q.pairs.map(p=>esc(p[0])+' → <b style="display:inline">'+esc(p[1])+'</b>').join('<br>')}${q.x?'<br><span class="muted">'+esc(q.x)+'</span>':''}`)};
   paint();
   if(done){reveal();setNext()}
   else if(!exam)primary.onclick=()=>{it.resp={...map};it.score=gradeM();recordQ(q,it.score);save();reveal();paintSegs();setNext()};
  }
  else if(q.t==='essay'){
   bodyEl.innerHTML=`<label class="sr" for="es">Your answer</label><textarea id="es" class="essay" placeholder="Write your answer in full sentences…">${esc(it.text||'')}</textarea><div class="wc" data-wc>0 words</div><div data-after></div>`;
   const ta=$('textarea',bodyEl),wc=$('[data-wc]',bodyEl),after=$('[data-after]',bodyEl);
   const count=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length;wc.textContent=n+' word'+(n===1?'':'s');return n};count();
   if(exam){/* essays are excluded from exam mode */}
   hint.textContent='Write first, then compare with the model answer';
   primary.textContent='Reveal model answer';
   ta.oninput=()=>{it.text=ta.value;primary.disabled=count()<3};primary.disabled=count()<3;
   const showModel=()=>{ta.readOnly=true;after.innerHTML=`<div class="model"><h5>Model answer</h5>${esc(q.model)}</div><div class="eyebrow" style="margin-top:18px">Self-check: tick every key point your answer covered</div><div class="checks">${q.points.map((p,i)=>`<label><input type="checkbox" data-pt="${i}" ${it.ticks&&it.ticks[i]?'checked':''}><span>${esc(p)}</span></label>`).join('')}</div>`};
   if(done){showModel();$$('[data-pt]',after).forEach(c=>c.disabled=true);showFb(true,`You covered ${Math.round(it.score*q.points.length)} of ${q.points.length} key points.`,true);setNext()}
   else primary.onclick=()=>{showModel();primary.textContent='Submit self-check';primary.disabled=false;
    primary.onclick=()=>{const ticks=$$('[data-pt]',after).map(c=>c.checked);it.ticks=ticks;it.resp=ta.value;it.score=ticks.filter(Boolean).length/ticks.length;recordQ(q,it.score);save();$$('[data-pt]',after).forEach(c=>c.disabled=true);
     showFb(true,`You covered ${ticks.filter(Boolean).length} of ${ticks.length} key points (${pct(it.score)}%). This counts toward your accuracy.`,true);paintSegs();setNext()}};
   setTimeout(()=>ta.focus({preventScroll:true}),50);
  }
 }
 function finish(){
  const secs=Math.floor((Date.now()-t0)/1000);
  if(exam){items.forEach(it=>{if(it.score==null)it.score=0;recordQ(it.q,it.score)})}
  const graded=items.filter(it=>it.score!=null);const total=graded.reduce((a,it)=>a+it.score,0);const acc=items.length?total/items.length:0;
  if(!exam&&!set.retry){const r=S.sets[set.id]||(S.sets[set.id]={best:0,attempts:0});r.attempts++;r.best=Math.max(r.best,acc);r.last=acc;r.date=Date.now()}
  else{S.exams=S.exams||[];S.exams.push({n:items.length,acc,date:Date.now(),secs})}
  save();cleanup();cleanup=null;app.innerHTML='';
  const missed=items.filter(it=>it.score<.999);
  const msg=acc>=.9?'Outstanding':acc>=.75?'Well charted':acc>=.5?'Keep sailing':'More study needed';
  const C=2*Math.PI*80;
  const v=h(`<section class="view res"><div class="logo"><img src="${$('.brand img').src}" alt="International Education Egypt"></div>
   <div class="eyebrow">${esc(set.title)}</div>
   <svg class="ring" viewBox="0 0 190 190"><circle class="trk" cx="95" cy="95" r="80"/><circle class="val" cx="95" cy="95" r="80" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><text x="95" y="110" text-anchor="middle">${pct(acc)}%</text></svg>
   <div class="stamp">${msg}</div>
   <p class="muted" style="margin-top:16px">${(Math.round(total*10)/10)} of ${items.length} points · ${Math.floor(secs/60)} min ${secs%60} s${items.some(it=>it.q.t==='essay')?' · written answers scored by your self-check':''}</p>
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">${missed.length&&!exam?`<button class="btn ox" data-retry>Retry the ${missed.length} missed</button>`:''}<button class="btn" data-again>${exam?'New exam':'Retake set'}</button><button class="btn ghost" data-home>Done</button></div>
   <div class="review">${items.map((it,i)=>{const q=it.q,ok=it.score>=.999,part=it.score>0&&!ok;let ans='';
     if(q.t==='mc')ans='Answer: '+esc(q.o[q.a]);else if(q.t==='tf')ans='Answer: '+(q.a?'True':'False');else if(q.t==='fill')ans='Answer: '+esc(q.ans);else if(q.t==='match')ans=q.pairs.map(p=>esc(p[0])+' → '+esc(p[1])).join(' · ');else ans='Self-check: '+pct(it.score)+'% of key points';
     return `<div class="rv"><div class="m" style="background:${ok?'var(--good)':part?'#C08A2E':'var(--bad)'}">${ok?'✓':part?'½':'✕'}</div><div><p><b>${i+1}.</b> ${esc(q.q)}</p><p class="a">${ans}</p></div></div>`}).join('')}</div></section>`);
  app.appendChild(v);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('.ring .val',v).style.strokeDashoffset=C*(1-acc)}));
  const r=$('[data-retry]',v);if(r)r.onclick=()=>runSet({...set,id:set.id+'-retry',title:set.title+' — missed questions',qs:missed.map(it=>it.q),group:set.group,retry:true});
  $('[data-again]',v).onclick=()=>exam?runSet({...set,qs:shuffle(AUTOQ).slice(0,set.qs.length)}):runSet(SET_BY[set.id]||set);
  $('[data-home]',v).onclick=()=>{const l=SET_BY[set.id]&&LESSON_BY[SET_BY[set.id].lesson];go(l?'lesson-'+l.id+'-ws':'practice')};
  refreshChip();window.scrollTo({top:0});
 }
 show();
}

/* ============ GAME: Atlantic Atlas ============ */
function viewGame(){
 const W=1000,H=620,proj=(lat,lon)=>[(lon+112)/128*W,(60-lat)/80*H];
 const ROUNDS=PLACES.length;
 let st=null;
 const grid=()=>{let g='';for(let lon=-110;lon<=10;lon+=10){const[x]=proj(0,lon);g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#B9A57A" stroke-width=".6"/>`}for(let lat=-20;lat<=60;lat+=10){const[,y]=proj(lat,0);g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${lat===0?'#9A3324':'#B9A57A'}" stroke-width="${lat===0?1.2:.6}"/>`}
  const c=proj(28,-40);for(let i=0;i<16;i++){const a=i*Math.PI/8;g+=`<line x1="${c[0]}" y1="${c[1]}" x2="${c[0]+900*Math.cos(a)}" y2="${c[1]+900*Math.sin(a)}" stroke="#9A3324" stroke-width=".5" opacity=".35"/>`}
  return g+`<text x="${c[0]}" y="${c[1]+70}" text-anchor="middle" font-family="Fraunces,serif" font-style="italic" font-size="30" fill="#8F7D57" letter-spacing="8">MARE OCEANUM</text>
   <g transform="translate(${W-90},${H-90})"><circle r="46" fill="#F1E7D3" stroke="#1C1A16"/><path d="M0-42L8 0 0 42-8 0Z" fill="#1C1A16"/><path d="M-42 0L0 8 42 0 0-8Z" fill="#B48A2C"/><text y="-50" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="16" fill="#9A3324">N</text></g>
   <text x="${proj(0,-111)[0]+4}" y="${proj(0,0)[1]-6}" font-size="12" fill="#9A3324" font-family="Instrument Sans">EQUATOR</text>`};
 const pins=PLACES.map((p,i)=>{const[x,y]=proj(p[2],p[3]);const right=x<W-160;return `<g class="pin" data-pin="${i}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle class="o" r="8"/><text x="${right?13:-13}" y="4" text-anchor="${right?'start':'end'}">${esc(p[0])}</text></g>`}).join('');
 const v=h(`<section class="view"><div class="eyebrow">Game</div><div class="secthead" style="margin-top:6px"><h2>Atlantic Atlas</h2><span class="muted">Answer correctly to chart each place on the map · Best: <b data-best>${S.game.best||0}</b></span></div>
  <div class="game"><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of the Atlantic world with places to unlock">${grid()}<path class="route" d=""/>${pins}</svg></div>
  <div class="panel gp"></div></div></section>`);
 app.appendChild(v);
 const panel=$('.gp',v),route_=$('.route',v),pinEls=$$('[data-pin]',v);
 const intro=()=>{panel.innerHTML=`<h3>Chart the New World</h3><p class="muted">${ROUNDS} places to unlock. Each one needs a correct answer to a question from your worksheets.</p><ul style="padding-left:18px;line-height:1.8"><li>20 seconds per question</li><li>3 lives, and a wrong answer or running out of time costs one</li><li>Streaks multiply your points (×2, ×3)</li></ul><button class="btn ox" data-sail style="width:100%">Set sail →</button>`;$('[data-sail]',panel).onclick=start};
 let timer=null;
 const start=()=>{st={r:0,lives:3,score:0,streak:0,pool:shuffle(GAMEQ),path:[]};pinEls.forEach(p=>p.classList.remove('lit','next'));route_.setAttribute('d','');round()};
 const round=()=>{if(st.r>=ROUNDS||st.lives<=0)return over();
  pinEls.forEach(p=>p.classList.remove('next'));pinEls[st.r].classList.add('next');
  const q=st.pool[st.r%st.pool.length];const ensure=q.t==='tf'?[['True',true],['False',false]]:shuffle(q.o.map((o,i)=>[o,i]));
  panel.innerHTML=`<div class="ghud"><div class="lives" aria-label="${st.lives} lives">${[0,1,2].map(i=>`<span class="${i<st.lives?'':'off'}">⚓</span>`).join('')}</div><div style="text-align:right"><div class="gscore" data-sc>${st.score}</div><div class="combo">${st.streak>=2?'Streak ×'+Math.min(3,st.streak):'&nbsp;'}</div></div></div>
   <div class="eyebrow">Next stop: ${esc(PLACES[st.r][0])} — ${esc(PLACES[st.r][1])}</div><div class="tbar"><i></i></div>
   <div class="gq"><div class="qtext">${esc(q.q)}</div><div class="opts">${ensure.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${LET[i]}</span><span>${esc(o[0])}</span></button>`).join('')}</div></div>`;
  const bar=$('.tbar i',panel);const T=20000,ts=Date.now();
  bar.style.transition='none';bar.style.width='100%';requestAnimationFrame(()=>{bar.style.transition=`width ${T}ms linear`;bar.style.width='0%'});
  clearTimeout(timer);timer=setTimeout(()=>answer(-1),T);
  const btns=$$('.opt',panel);
  const answer=i=>{clearTimeout(timer);bar.style.transition='none';bar.style.width=getComputedStyle(bar).width;btns.forEach(b=>b.disabled=true);
   const ok=i>=0&&ensure[i][1]===q.a;btns.forEach((b,j)=>{if(ensure[j][1]===q.a)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
   recordQ(q,ok?1:0);
   if(ok){st.streak++;const mult=Math.min(3,Math.max(1,st.streak));const fast=Math.max(0,Math.round((T-(Date.now()-ts))/1000));const gain=(100+fast*5)*mult;st.score+=gain;
    pinEls[st.r].classList.remove('next');pinEls[st.r].classList.add('lit');const p=PLACES[st.r];st.path.push(proj(p[2],p[3]));
    route_.setAttribute('d',st.path.map((pt,k)=>(k?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(''));
    const f=h(`<div class="float" style="right:20px;top:40px">+${gain}</div>`);panel.style.position='relative';panel.appendChild(f);setTimeout(()=>f.remove(),1000);
    $('[data-sc]',panel).textContent=st.score;st.r++;}
   else{st.streak=0;st.lives--;$$('.lives span',panel)[st.lives]?.classList.add('off')}
   save();
   const nx=h(`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Charted!':i<0?'Out of time.':'Wrong course.'}</b>${ok?'':'Answer: '+esc(q.t==='tf'?(q.a?'True':'False'):q.o[q.a])+'. '}${esc(q.x||'')}</div>`);
   $('.gq',panel).appendChild(nx);const c=h(`<button class="btn" style="width:100%;margin-top:12px" data-primary>Continue →</button>`);$('.gq',panel).appendChild(c);c.focus({preventScroll:true});
   if(!ok)st.pool.splice(st.r,1);  // draw a fresh question for this stop next time
   c.onclick=round};
  btns.forEach((b,i)=>b.onclick=()=>answer(i));
 };
 const over=()=>{clearTimeout(timer);pinEls.forEach(p=>p.classList.remove('next'));const won=st.r>=ROUNDS;S.game.plays=(S.game.plays||0)+1;const best=st.score>(S.game.best||0);if(best)S.game.best=st.score;save();$('[data-best]',v).textContent=S.game.best;
  panel.innerHTML=`<div style="text-align:center"><div class="eyebrow">${won?'Voyage complete':'Shipwrecked'}</div><div class="gscore" style="font-size:56px;margin:8px 0">${st.score}</div><p class="muted">${st.r} of ${ROUNDS} places charted${best?' · <b style="color:var(--ox)">New best!</b>':''}</p><button class="btn ox" style="width:100%" data-again>Sail again</button><button class="btn ghost" style="width:100%;margin-top:8px" data-rep>See my report</button></div>`;
  $('[data-again]',panel).onclick=start;$('[data-rep]',panel).onclick=()=>go('report');refreshChip()};
 cleanup=()=>clearTimeout(timer);
 intro();
}

/* ============ REPORT ============ */
function viewReport(){
 const o=overall();
 const per=[...LESSONS,REVIEW].map(l=>({l,...lessonStats(l.id)}));
 const weak=Object.entries(S.q).filter(([,r])=>r.n&&r.s/r.n<.75).sort((a,b)=>a[1].s/a[1].n-b[1].s/b[1].n).slice(0,10).map(([id,r])=>({q:ALLQ.find(q=>q.id===id),r})).filter(x=>x.q);
 const v=h(`<section class="view"><div class="eyebrow">Student performance report</div><div class="secthead" style="margin-top:6px"><h2>How you're doing</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-copy>Copy report</button><button class="btn sm ghost" data-reset>Reset progress</button></div></div>
 ${Object.keys(S.q).length?'':'<div class="empty">No answers yet. Finish a worksheet and your accuracy for each lesson and set will show here.</div>'}
 <div class="grid2" style="margin-top:10px">
  <div class="panel"><h3>Accuracy by lesson</h3><p class="muted" style="margin-top:0">Overall: <b>${o==null?'—':pct(o)+'%'}</b> · ${Object.keys(S.q).length}/${ALLQ.length} questions tried${S.game.plays?` · Game best ${S.game.best}`:''}</p>
   <div class="bars">${per.map(p=>`<div class="barrow" style="--lc:${p.l.color}"><div><b>${esc(p.l.short)}</b><div class="muted" style="font-size:13px">${p.seen}/${p.total} tried</div></div><div class="pbar"><i data-w="${p.acc==null?0:pct(p.acc)}"></i></div><div class="score" style="font-size:18px">${p.acc==null?'—':pct(p.acc)+'%'}</div></div>`).join('')}</div></div>
  <div class="panel"><h3>Questions to review</h3>${weak.length?`<ol class="weak">${weak.map(w=>`<li>${esc(w.q.q)} <span class="muted">— ${pct(w.r.s/w.r.n)}% over ${w.r.n} attempt${w.r.n>1?'s':''}</span></li>`).join('')}</ol>`:'<p class="muted">Nothing flagged yet. Questions you score under 75% on will be listed here.</p>'}
   ${(S.exams||[]).length?`<h3 style="margin-top:20px;font-size:20px">Mock finals</h3><ul>${S.exams.slice(-5).reverse().map(e=>`<li>${new Date(e.date).toLocaleDateString()} — ${pct(e.acc)}% on ${e.n} questions</li>`).join('')}</ul>`:''}</div>
 </div>
 <div class="secthead"><h2 style="font-size:24px">Every set</h2></div><div class="wlist">${SETS.map(setRow).join('')}</div></section>`);
 app.appendChild(v);animateIn(v);
 v.addEventListener('click',e=>{const b=e.target.closest('[data-run]');if(b)runSet(SET_BY[b.dataset.run])});
 $('[data-reset]',v).onclick=()=>confirmBox('Reset all progress?','This clears scores, flashcards and the game best score in this browser. It cannot be undone.','Reset',()=>{S={sets:{},q:{},flash:{},game:{best:0,plays:0}};save();route();toast('Progress reset')});
 $('[data-copy]',v).onclick=async()=>{const lines=['International Education Egypt — HMH English Social Studies Grade 8 · Final Review report',`Date: ${new Date().toLocaleDateString()}`,`Overall accuracy: ${o==null?'n/a':pct(o)+'%'} (${Object.keys(S.q).length}/${ALLQ.length} questions tried)`,'',...per.map(p=>`${p.l.short}: ${p.acc==null?'not started':pct(p.acc)+'%'} (${p.seen}/${p.total})`),'','Sets:',...SETS.filter(s=>S.sets[s.id]).map(s=>`- ${s.title} (${s.kind}): best ${pct(S.sets[s.id].best)}%`)];
  try{await navigator.clipboard.writeText(lines.join('\n'));toast('Report copied')}catch(err){toast('Copy is blocked here. Select the text on screen instead.')}};
}
